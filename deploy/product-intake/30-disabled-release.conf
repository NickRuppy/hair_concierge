# Worker-only override for a code release preserving installed resource settings.
# release.env contains only PRODUCT_INTAKE_RELEASE_SHA=<reviewed full SHA>.
[Service]
EnvironmentFile=/opt/chaarlie/product-intake/shared/release.env
Environment=PRODUCT_INTAKE_REVIEW_EMAILS=false
Environment=PRODUCT_INTAKE_AUTO_PREPARE_IMAGES=false
Environment=PRODUCT_INTAKE_AUTO_REWORK=false
