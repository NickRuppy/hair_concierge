<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chaarlie Login-Link – approved header placement</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px; background: #f3eef4; color: #321d3d; font-family: Inter, system-ui, sans-serif; }
      main { display: grid; gap: 30px; max-width: 980px; margin: 0 auto; }
      .label { margin: 0 0 8px; color: #78667d; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      .surface { overflow: hidden; border: 1px solid rgba(50,29,61,.1); border-radius: 18px; background: #fcfaf7; box-shadow: 0 18px 44px rgba(50,29,61,.1); }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid rgba(50,29,61,.08); }
      .brand { color: #321d3d; font-family: Georgia, serif; font-size: 24px; font-weight: 700; text-decoration: none; }
      nav { display: flex; align-items: center; gap: 14px; }
      .login { display: inline-flex; min-height: 42px; align-items: center; color: #68566d; font-size: 14px; font-weight: 600; text-decoration: none; }
      .analysis { display: inline-flex; min-height: 42px; align-items: center; padding: 0 17px; border-radius: 999px; background: #6d3477; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .hero { padding: 48px 36px 58px; }
      .eyebrow { margin: 0 0 14px; color: #806187; font-size: 12px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
      h1 { max-width: 560px; margin: 0; font-family: Georgia, serif; font-size: clamp(38px, 6vw, 62px); line-height: .98; letter-spacing: -.045em; }
      .mobile { width: min(100%, 375px); margin: 0 auto; }
      .mobile header { gap: 10px; padding: 11px 14px; }
      .mobile .brand { font-size: 22px; }
      .mobile nav { gap: 10px; }
      .mobile .login, .mobile .analysis { min-height: 40px; font-size: 13px; }
      .mobile .analysis { padding: 0 12px; }
      .mobile .hero { padding: 34px 22px 40px; }
      .mobile h1 { font-size: 42px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="label">Desktop</p>
        <div class="surface">
          <header>
            <a class="brand" href="#">chaarlie</a>
            <nav aria-label="Seitennavigation">
              <a class="login" href="#">Anmelden</a>
              <a class="analysis" href="#">Analyse starten</a>
            </nav>
          </header>
          <div class="hero">
            <p class="eyebrow">Kostenlose Haaranalyse</p>
            <h1>Versteh dein Haar. Ohne Produktchaos.</h1>
          </div>
        </div>
      </section>
      <section class="mobile">
        <p class="label">Mobile · 375 px</p>
        <div class="surface">
          <header>
            <a class="brand" href="#">chaarlie</a>
            <nav aria-label="Seitennavigation">
              <a class="login" href="#">Anmelden</a>
              <a class="analysis" href="#">Analyse starten</a>
            </nav>
          </header>
          <div class="hero">
            <p class="eyebrow">Kostenlose Haaranalyse</p>
            <h1>Versteh dein Haar. Ohne Produktchaos.</h1>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
