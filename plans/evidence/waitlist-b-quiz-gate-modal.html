<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz-Gate Modal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --plum: #6b50a0;
        --plum-dark: #2a1845;
        --coral: #d4616a;
        --coral-dark: #c0555d;
        --card: #fff;
        --fg: #3b3635;
        --muted: #6e6866;
        --border: #e8e3df;
        --display: "Playfair Display", Georgia, serif;
        --body: "Plus Jakarta Sans", Arial, sans-serif;
        --mono: "IBM Plex Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: var(--body);
        color: var(--fg);
        line-height: 1.6;
        background: rgba(42, 24, 69, 0.55);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .modal {
        background: var(--card);
        border-radius: 20px;
        max-width: 430px;
        width: 100%;
        padding: 32px 28px 26px;
        position: relative;
        box-shadow: 0 24px 70px rgba(42, 24, 69, 0.3);
      }
      .close {
        position: absolute;
        top: 14px;
        right: 16px;
        border: 0;
        background: transparent;
        font-size: 22px;
        color: #a59e9b;
      }
      .badge {
        display: inline-block;
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        padding: 6px 11px;
        border-radius: 99px;
        color: #8a3d45;
        background: #fbeeef;
        border: 1px solid #f2dcde;
      }
      h2 {
        font-family: var(--display);
        font-size: 1.72rem;
        line-height: 1.2;
        color: var(--plum-dark);
        margin-top: 15px;
        font-weight: 700;
      }
      .sub {
        color: var(--muted);
        margin-top: 12px;
        font-size: 0.98rem;
      }
      .sub b {
        color: var(--plum-dark);
      }
      form {
        margin-top: 22px;
        display: grid;
        gap: 9px;
      }
      input {
        width: 100%;
        padding: 13px 15px;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }
      .cta {
        width: 100%;
        padding: 15px;
        border: 0;
        border-radius: 10px;
        background: var(--coral);
        color: #fff;
        font: inherit;
        font-weight: 700;
        font-size: 1rem;
      }
      .fine {
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
        margin-top: 10px;
        line-height: 1.5;
      }
      .fine a {
        color: var(--plum);
      }
    </style>
  </head>
  <body>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quiz-gate-title">
      <button class="close" aria-label="Schließen">&times;</button>
      <span class="badge">Bald wieder offen</span>
      <h2 id="quiz-gate-title">Aktuell nehmen wir keine neuen Auswertungen an</h2>
      <p class="sub">
        Wir bauen die Auswertung weiter aus und öffnen am <b>Sonntag, 9. August,</b> wieder. Melde
        dich kostenlos an, dann ist dein Platz reserviert.
      </p>
      <form>
        <label
          ><span hidden>Dein Vorname</span><input type="text" placeholder="Dein Vorname" required
        /></label>
        <label
          ><span hidden>Deine E-Mail-Adresse</span
          ><input type="email" placeholder="Deine E-Mail-Adresse" required
        /></label>
        <button class="cta" type="submit">Platz vormerken</button>
      </form>
      <p class="fine">
        Du bekommst E-Mails zum Start von chaarlie. Abmelden jederzeit.
        <a href="/datenschutz">Datenschutz</a>
      </p>
    </div>
  </body>
</html>
