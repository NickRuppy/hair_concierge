<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chaarlie · Aktivierung – Fehlerzustände</title>
<style>
@font-face{font-family:Jakarta;src:url('/public/fonts/PlusJakartaSans-Regular.ttf')}@font-face{font-family:Playfair;src:url('/public/fonts/PlayfairDisplay-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;background:hsl(30 27% 98%);color:hsl(15 6% 22%);font:16px/1.5 Jakarta,Arial,sans-serif}nav{padding:12px 16px;border-bottom:1px solid #e6e3e0;display:flex;gap:8px;flex-wrap:wrap;background:#fff}nav a{font:12px Jakarta;color:#6b50a0;padding:6px 10px;border:1px solid #ddd;border-radius:8px;text-decoration:none}nav a[aria-current]{background:#f2eefa;border-color:#6b50a0}nav small{width:100%;color:#736f69}main{min-height:calc(100vh - 104px);display:flex;align-items:center;justify-content:center;padding:32px 16px}.wrap{width:100%;max-width:896px}.heading{text-align:center;margin-bottom:24px}.icon{width:48px;height:48px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#f2eefa;color:#6b50a0;font-size:24px}.before .icon{background:#dcfce7;color:#16a34a}.before .alert{background:hsl(0 84.2% 60.2% / .1);color:hsl(0 84.2% 60.2%)}.eyebrow{font-size:14px;color:#6b50a0;margin:0 0 8px}h1{font:36px/1.2 Playfair,Georgia,serif;margin:0 0 8px}p{margin:0 0 12px}.sub{color:#6a6560}.email{max-width:448px;margin:0 auto 24px;font-size:14px}.input{margin-top:8px;height:44px;border:1px solid #e6e3e0;border-radius:12px;background:#f6f3fa;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0002}.panel{max-width:448px;margin:auto;padding:24px;border:1px solid #e6e3e0;border-radius:14px;background:#fff;box-shadow:0 1px 3px #0001}.panel h2{font:600 18px/1.4 Jakarta;margin:0 0 12px}.panel p{font-size:14px;line-height:1.7;color:#6a6560}.actions{display:grid;gap:12px;margin-top:24px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #6b50a0;border-radius:14px;color:#6b50a0;padding:12px 18px;font:14px Jakarta;text-decoration:none;background:transparent;text-align:center}.link{color:#6b50a0;text-align:center;font-size:14px;text-underline-offset:4px}.alert{padding:16px;border-radius:14px;margin:24px 0;background:#fff0f1;color:#9a3f48;font-size:14px;text-align:center}.forms{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form{padding:20px;border:1px solid #e6e3e0;border-radius:14px;background:#fff;min-height:0;display:flex;flex-direction:column;box-shadow:0 1px 3px #0001}.form h2{font:600 20px Jakarta;margin:0 0 8px}.form p{font-size:14px;color:#6a6560;line-height:24px}.form label{font-size:14px;margin-top:14px}.form .input{background:#fff}.form .btn{margin-top:16px}.before .form{min-height:360px}.before .form .btn{margin-top:auto}.form:has(h2 + button){min-height:130px}.help{text-align:center;font-size:14px;margin-top:16px}.note{font-size:12px;color:#736f69;text-align:center;margin:24px 0 0}.mobile main{max-width:390px;margin:auto;border-left:1px solid #eee;border-right:1px solid #eee}.mobile .forms{grid-template-columns:1fr}.mobile h1{font-size:30px}@media(max-width:639px){h1{font-size:30px}.forms{grid-template-columns:1fr}.panel{padding:20px}}
</style>
<nav id="nav"><small>Entwurf · Bestehende Aktivierungsseite · Nur Vorschau, keine Anmeldung oder Zahlung</small></nav><main><div class="wrap" id="content"></div></main>
<script>
const params=new URLSearchParams(location.search),state=params.get('state')||'ineligible';if(params.get('width')==='390')document.body.classList.add('mobile');
const states={before:'Bisher',ineligible:'Test nicht verfügbar',pending:'Prüfung läuft',temporary:'Vorübergehender Fehler',expired:'Link nicht mehr gültig',throttled:'Zu viele Versuche',closed:'Anmeldung beendet',reconcile:'Klärung nötig',reserved:'Andere Anmeldung',send:'E-Mail nicht gesendet',existing:'Zugang vorhanden',consumed:'Aktivierung verwendet',signin:'Anmeldung fehlgeschlagen'};
for(const [key,label] of Object.entries(states)){const a=document.createElement('a');a.textContent=label;a.href='?state='+key+(params.has('width')?'&width=390':'');if(key===state)a.setAttribute('aria-current','page');document.querySelector('#nav').append(a)}
const data={
closed:{title:'Anmeldung beendet',body:'Dieser Link kann deinen Zugang nicht mehr aktivieren. Unser Support hilft dir weiter.',cta:'Support kontaktieren',secondary:'Ich habe bereits ein Konto'},
reconcile:{title:'Zugang noch nicht bereit',body:'Wir müssen deinen Zugang und die Zahlungsfreigabe prüfen. Starte bitte keine neue Anmeldung.',cta:'Support kontaktieren',secondary:'Ich habe bereits ein Konto'},
reserved:{title:'Andere Anmeldung offen',body:'Fahre in deiner zuvor geöffneten Anmeldung fort. Du findest sie nicht mehr? Kontaktiere unseren Support.',cta:'Support kontaktieren',secondary:'Ich habe bereits ein Konto'},
ineligible:{title:'Kein weiterer kostenloser Test',body:'Für dieses Konto oder die Zahlungsmethode gab es bereits einen Test oder ein Abo. Das stimmt nicht? Wir prüfen es für dich.',cta:'Support kontaktieren',secondary:'Ich habe bereits ein Konto'},
pending:{title:'Zugang wird vorbereitet',body:'Die Einrichtung läuft noch. Prüfe den Status gleich erneut.',cta:'Status prüfen',secondary:'Support kontaktieren'},
expired:{title:'Link nicht mehr gültig',body:'Melde dich mit deinem bestehenden Konto an. Noch kein Zugang? Kontaktiere unseren Support.',cta:'Ich habe bereits ein Konto',secondary:'Support kontaktieren'},
existing:{title:'Zugang bereits vorhanden',body:'Melde dich mit deinem bestehenden Konto an.',cta:'Zum Login',secondary:'Support kontaktieren'},
consumed:{title:'Bitte melde dich an',body:'Nutze dein Passwort oder fordere im Login einen neuen Login-Link an.',cta:'Zum Login',secondary:'Support kontaktieren'},
signin:{title:'Passwort gespeichert',body:'Die Anmeldung hat nicht geklappt. Nutze dein neues Passwort im Login.',cta:'Zum Login',secondary:'Support kontaktieren'}
};
const heading=(title,sub,icon='!')=>`<div class="heading"><div class="icon" aria-hidden="true">${icon}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`;
const email='<div class="email"><label>Deine E-Mail-Adresse</label><div class="input">alex@example.com</div></div>';
const originalForms='<div class="forms"><section class="form"><h2>Mit Passwort fortfahren</h2><p>Erstelle ein Passwort und melde dich künftig direkt mit deiner E-Mail an.</p><label>Passwort</label><div class="input"></div><label>Passwort wiederholen</label><div class="input"></div><p style="margin-top:14px">○ Mindestens 8 Zeichen<br>○ Beide Passwörter stimmen überein</p><button class="btn" disabled>Passwort erstellen</button></section><section class="form"><h2>Ohne Passwort fortfahren</h2><p>Wir senden dir einen sicheren Login-Link. Du klickst ihn im Postfach an und bist direkt angemeldet.</p><button class="btn">Login-Link senden</button></section></div>';
const forms=originalForms.replace('Mit Passwort fortfahren','Mit Passwort').replace('Ohne Passwort fortfahren','Mit Login-Link').replace('<p>Erstelle ein Passwort und melde dich künftig direkt mit deiner E-Mail an.</p>','').replace('<p>Wir senden dir einen sicheren Login-Link. Du klickst ihn im Postfach an und bist direkt angemeldet.</p>','');
let html='';if(data[state]){const d=data[state];html=heading(d.title,'')+`<section class="panel" role="alert"><p>${d.body}</p><div class="actions"><button class="btn">${d.cta}</button><a href="#" class="link">${d.secondary}</a></div></section>`}else{const message=state==='before'?'Kontoaktivierung konnte nicht abgeschlossen werden. Bitte versuche es erneut.':state==='send'?'Dein Konto ist bereit. Der Login-Link konnte nicht gesendet werden. Bitte erneut senden.':state==='throttled'?'Zu viele Versuche in kurzer Zeit. Bitte warte etwas und versuche es dann erneut.':'Das hat gerade nicht geklappt. Bitte versuche es erneut.';if(state==='before')document.body.classList.add('before');html=heading('Konto aktivieren',state==='before'?'Wähle, wie du dich bei Chaarlie anmelden möchtest.':'','✓')+email+`<div class="alert" role="alert">${message}${state==='before'?'':' <a class="link" href="#">Hilfe</a>'}</div>`+(state==='before'?originalForms:forms)}
document.querySelector('#content').innerHTML=html+'<p class="note">Vorschau: Buttons lösen keine Aktion aus.</p>';
</script></html>
