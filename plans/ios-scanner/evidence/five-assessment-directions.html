</style></head><body><header class="boardhead"><div><div class="wordmark">chaarlie</div><p>Fünf Richtungen. Eine Einschätzung. Alle Gründe sichtbar.</p></div><button id="textsize" aria-pressed="false">Größere Schrift testen</button></header><main class="layout"><nav class="choices" id="choices" aria-label="Designrichtungen"></nav><section style="width:100%"><div class="phone" id="phone"><div class="status"><span>9:41</span><span class="island"></span><span>▴ ▰</span></div><div class="content" id="content"></div><div class="footer" id="footer"></div><div class="home"></div></div><div class="annotation">Fiktive MIRA-Daten · gezeichnetes Produkt · keine Kamera</div></section><aside class="notes" id="notes"></aside></main><div class="toast" id="toast" role="status"></div><script>
(()=>{
const close='<button class="close" aria-label="Bewertung schließen" data-action="close">×</button>';

const jar='<div class="jarbox"><div class="jar"></div></div>';
const identity=()=>`<div class="identity">${jar}<div><div class="meta">MIRA · Maske</div><div class="name">Rich Haarmaske</div></div></div>`;
const row=(name,value,target,good)=>`<div class="resultrow"><div class="rowhead"><b>${name}</b><span class="${good?'tick':'bad'}">${good?'✓':'!'} ${value}</span></div><div class="rowdetail">Dein Ziel: <b>${target}</b>${good?' · stimmt überein':' · zu reichhaltig'}</div></div>`;
const meter=(name,stops,point)=>`<div class="meter ${point===1?'':'warn'}"><div class="rowhead"><b>${name}</b><span class="state">${point===1?'✓ passt':'! darüber'}</span></div><div class="metertrack">${stops.map((_,i)=>`<span class="${i===1?'target':''} ${i===point?'point':''}"></span>`).join('')}</div><div class="stops">${stops.map(s=>`<span>${s}</span>`).join('')}</div></div>`;
const chip=(name,val,target,good)=>`<div class="fitchip ${good?'':'warn'}"><div class="rowhead"><b>${name}</b><span class="${good?'tick':'bad'}">${good?'✓ passt':'! darüber'}</span></div><div class="rowdetail">Produkt: <b>${val}</b><br>Dein Ziel: <b>${target}</b></div></div>`;
const designs=[
{id:'verdict',name:'Das Urteil',tag:'01 / Editorial',title:'Eine starke Antwort. Drei Belege.',description:'Ein dunkler, markanter Urteilskopf gibt die Richtung vor. Darunter stehen die drei Eigenschaften wie eine kurze, präzise Zusammenfassung.',strength:'Schnell zu verstehen, sehr eigenständiger Markenauftritt.',tradeoff:'Der große Urteilskopf braucht mehr Raum als die Vergleichstabelle.',html:()=>`${topline()}<div class="pad">${identity()}<div class="verdictlead"><span class="floatinglabel">! Passt mit Einschränkung</span><h1 class="headline">Für dein Ziel<br>zu reichhaltig.</h1><p>Die zwei anderen Eigenschaften passen.</p><div class="mini" aria-hidden="true"><i></i><i></i><i></i></div></div>${row('Pflegegewicht','reichhaltig','mittel',false)}${row('Pflegerichtung','ausgeglichen','ausgeglichen',true)}${row('Repair-Unterstützung','mittel','mittel',true)}</div>`},
{id:'matrix',name:'Der Direktvergleich',tag:'02 / Maximale Klarheit',title:'Produkt links. Dein Ziel rechts.',description:'Eine kompakte Vergleichstabelle ersetzt Fließtext und wiederholte Diagrammlegenden. Der Unterschied springt direkt ins Auge.',strength:'Der höchste Informationsgehalt pro Zeile. Meine Empfehlung für die Grundstruktur.',tradeoff:'Weniger emotional als die anderen Varianten; dafür sehr leicht vergleichbar.',html:()=>`${topline()}<div class="pad">${identity()}<div class="matrixlead"><h1 class="headline">Passt mit<br>Einschränkung.</h1><span class="signal">!</span></div><div class="comparison" role="table" aria-label="Produkt und persönliches Ziel"><div class="compheader" role="columnheader">Dieses Produkt</div><div class="compheader right" role="columnheader">Dein Ziel</div><div class="compname">Pflegegewicht</div><div class="compcell warn">! Reichhaltig</div><div class="compcell right">Mittel</div><div class="compname">Pflegerichtung</div><div class="compcell">Ausgeglichen</div><div class="compcell right">✓ Ausgeglichen</div><div class="compname">Repair-Unterstützung</div><div class="compcell">Mittel</div><div class="compcell right">✓ Mittel</div></div><p class="matrixnote">↗ Das Pflegegewicht liegt über deinem Ziel.</p></div>`},
{id:'instrument',name:'Die Messkarte',tag:'03 / Präzision bei Nacht',title:'Du siehst, wo es abweicht.',description:'Drei gut lesbare Skalen auf einer dunklen Fläche. Die Zielmarkierung und der Produktpunkt erklären die Abweichung räumlich.',strength:'Das stärkste visuelle Modell für Produkt gegen Ziel. Alle Skalen bleiben sichtbar.',tradeoff:'Benötigt eine klare Legende; bei größeren Schriftgrößen darf die Ansicht scrollen.',html:()=>`${topline()}<div class="pad">${identity()}<div class="instrumenthead"><h1 class="headline">Passt mit<br>Einschränkung</h1><span class="badge">1 Abweichung</span></div><div class="meterlegend"><span><i></i>Dein Ziel</span><span><i></i>Produkt</span></div>${meter('Pflegegewicht',['leicht','mittel','reichhaltig'],2)}${meter('Pflegerichtung',['Feuchtigkeit','ausgeglichen','Protein'],1)}${meter('Repair-Unterstützung',['niedrig','mittel','hoch'],1)}<p class="instrumentwhy">Das Pflegegewicht ist höher als dein Ziel.</p></div>`},
{id:'split',name:'Die Entscheidung',tag:'04 / Erst der Haken',title:'Was spricht dagegen? Was dafür?',description:'Die einzige Abweichung kommt zuerst. Die passenden Eigenschaften stehen gemeinsam darunter. Keine Suche nach dem entscheidenden Punkt.',strength:'Am schnellsten für eine Entscheidung im Laden. Meine Empfehlung für gemischte Ergebnisse.',tradeoff:'Die Reihenfolge wechselt je nach Bewertung; Kategorien brauchen trotzdem feste, erkennbare Namen.',html:()=>`${topline()}<div class="pad">${identity()}<h1 class="splitheadline">Zwei Treffer.<br>Ein wichtiger Haken.</h1><div class="cautioncard"><div class="sectiontitle">! Pflegegewicht</div><strong>Reichhaltiger als dein Ziel.</strong><p>Produkt: reichhaltig<br>Dein Ziel: mittel</p></div><div class="supportcard"><div class="sectiontitle">✓ Das passt</div>${row('Pflegerichtung','ausgeglichen','ausgeglichen',true)}${row('Repair-Unterstützung','mittel','mittel',true)}</div></div>`},
{id:'overlay',name:'Der Scanner-Layer',tag:'05 / Kamera wird Ergebnis',title:'Der Scan verwandelt sich in die Antwort.',description:'Ein schmaler Rest des Kamerabilds erhält den Zusammenhang zum Produkt. Die Bewertung erscheint auf einer ruhigen, deckenden Fläche darüber.',strength:'Die stärkste räumliche Verbindung zwischen Scannen und Ergebnis. Native Sheet-Bewegung kann den Übergang verständlich machen.',tradeoff:'Das Kamerafenster kostet Platz. Im echten App-Ablauf wird die Kamera unter dem Ergebnis pausiert.',html:()=>`<div class="scanambient"><span class="glasslabel">Barcode erkannt</span><div class="jar"></div>${close}</div><div class="overlaysheet"><div class="grabber"></div><div class="overlayheading"><div><div class="meta">MIRA · Maske</div><strong>Rich Haarmaske</strong></div></div><div class="pillverdict"><h1 class="headline">Passt mit Einschränkung</h1><p>Die Pflege ist reichhaltiger als dein Ziel.</p></div><div class="fitchips">${chip('Pflegegewicht','reichhaltig','mittel',false)}${chip('Pflegerichtung','ausgeglichen','ausgeglichen',true)}${chip('Repair-Unterstützung','mittel','mittel',true)}</div></div>`}
];
let active=designs.some(d=>d.id===location.hash.slice(1))?location.hash.slice(1):'matrix';
const content=document.getElementById('content');
function show(id){active=id;const d=designs.find(x=>x.id===id);document.getElementById('phone').dataset.design=id;content.innerHTML=d.html();content.scrollTop=0;document.getElementById('footer').className='footer '+(id==='overlay'?'overlayfooter':'');document.getElementById('footer').innerHTML='<button class="primary" data-action="alternatives">Alternativen · 2</button><button class="secondary" data-action="buy">Shop ↗</button>';document.getElementById('notes').innerHTML=`<div class="kicker">${d.tag}</div><h1>${d.title}</h1><p>${d.description}</p><hr><p><b>Stärke</b><br>${d.strength}</p><p><b>Abwägung</b><br>${d.tradeoff}</p><hr><p>In allen fünf Entwürfen: dasselbe fiktive Produkt, dieselben drei Kriterien und dieselben Ziele. Keine neue Bewertungslogik, kein Speichern und keine echten Käufe.</p><p>Große Textansicht oben testen. Inhalte dürfen bei größerer Schrift scrollen; Hauptgründe werden nie eingeklappt.</p>`;document.querySelectorAll('[data-design-choice]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.designChoice===id)));document.getElementById('toast').textContent='';history.replaceState(null,'','#'+id)}
document.getElementById('choices').innerHTML=designs.map(d=>`<button class="choice" data-design-choice="${d.id}"><span>${d.tag}</span><b>${d.name}</b></button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.designChoice){show(b.dataset.designChoice);return}if(b.id==='textsize'){const on=document.body.classList.toggle('large');b.setAttribute('aria-pressed',String(on));b.textContent=on?'Standardschrift anzeigen':'Größere Schrift testen';return}if(b.dataset.action==='buy'){document.getElementById('toast').textContent='Shop-Übergang simuliert. Kein Kauf wird ausgeführt.'}if(b.dataset.action==='alternatives'){content.innerHTML=`<div class="pad alternativesview"><button class="back" data-action="back">‹ Zur Einschätzung</button><h1>Passende Alternativen</h1><div class="altcard"><strong>MIRA Balance Maske</strong><p>Pflegegewicht: mittel<br>Pflegerichtung: ausgeglichen<br>Repair-Unterstützung: mittel</p><p>✓ Alle drei Werte treffen dein Ziel.</p><button data-action="buy">Im Shop ansehen ↗</button></div><div class="altcard"><strong>MIRA Daily Maske</strong><p>Pflegegewicht: mittel<br>Pflegerichtung: ausgeglichen<br>Repair-Unterstützung: mittel</p><p>✓ Alle drei Werte treffen dein Ziel.</p><button data-action="buy">Im Shop ansehen ↗</button></div></div>`;content.scrollTop=0;document.getElementById('phone').dataset.design='matrix';document.getElementById('footer').innerHTML='<button class="primary" data-action="back">Zur Einschätzung</button>'}if(b.dataset.action==='back')show(active);if(b.dataset.action==='close'){content.innerHTML='<div class="dismissed"><h1>Zurück zum Scanner</h1><p>Der Kameraübergang ist in dieser Designstudie simuliert.</p><button data-action="back">Bewertung erneut öffnen</button></div>';document.getElementById('phone').dataset.design='matrix';document.getElementById('footer').innerHTML=''}});show(active);
})();
</script></body></html>
