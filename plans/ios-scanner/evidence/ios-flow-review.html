<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaarlie · iOS Flow Review</title>
<style>
:root{--ink:#302a36;--muted:#79717f;--purple:#70519b;--tint:#f0eaf7;--line:#e9e2ea;--paper:#fcfaf8;--green:#33654e;--amber:#875d27}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#eeebe8;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #a083c4;outline-offset:3px}button{border:0}header.board{padding:24px 38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dcd6d4}.brand{font-size:27px;font-weight:650;letter-spacing:-1.5px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}.board p{margin:2px 0 0;font-size:13px;color:var(--muted)}main{max-width:1140px;margin:auto;display:grid;grid-template-columns:230px 393px minmax(210px,270px);gap:44px;padding:30px 25px;align-items:start}.chapters{padding-top:14px}.group{margin-bottom:22px}.group h2{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 10px 8px}.jump{display:block;text-align:left;padding:9px 11px;border-radius:8px;width:100%;background:none;font-size:13px;margin:2px 0}.jump[aria-current=page]{background:white;box-shadow:0 2px 8px #38244208;font-weight:650;color:var(--purple)}.jump .num{display:inline-block;width:25px;color:#9c909f;font-size:11px}.phone{width:393px;height:820px;background:var(--paper);border:7px solid #28262a;border-radius:47px;box-shadow:0 22px 65px #32283a1c;overflow:hidden;position:relative;display:flex;flex-direction:column}.status{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:13px;font-weight:650;z-index:4;background:var(--paper)}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:105px;height:27px;background:#28262a;border-radius:20px}.signals{font-size:12px;letter-spacing:2px}.screen{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}.screen::-webkit-scrollbar{display:none}.pad{padding:12px 23px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin-bottom:23px}.top .brand{font-size:25px}.textbtn{background:none;color:var(--purple);padding:8px 0;font-size:13px}.back{background:none;padding:8px 0;font-size:14px;color:var(--purple)}h1{font-size:29px;line-height:1.15;letter-spacing:-.9px;margin:12px 0 15px;font-weight:650}h2{font-size:18px;line-height:1.3;margin:24px 0 11px;letter-spacing:-.3px}h3{font-size:16px;margin:0 0 8px}.serif{font-family:Georgia,serif;font-size:31px;font-weight:400;letter-spacing:-.8px;line-height:1.15}p{margin:0 0 17px}.sub{color:var(--muted);font-size:14px;line-height:1.55}.tiny{font-size:12px;line-height:1.5;color:var(--muted)}.primary,.outline{width:100%;min-height:50px;border-radius:13px;padding:13px 14px;font-weight:600;margin:6px 0}.primary{background:var(--purple);color:white}.outline{border:1px solid var(--line);background:white}.danger{color:#a83c45}.primary.danger{color:white;background:#a83c45}.progress{height:4px;background:#e8e3e9;border-radius:4px;margin:0 0 27px}.progress span{height:4px;background:var(--purple);display:block;border-radius:4px}.option{width:100%;background:white;text-align:left;border:1px solid #dcd2e7;border-radius:15px;padding:17px 15px;margin:6px 0;display:flex;align-items:center;gap:12px;box-shadow:0 3px 8px #46354b03}.option b{display:block;font-size:15px;font-weight:550}.option small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.option.selected{background:var(--tint);border-color:var(--purple)}.symbol{width:35px;height:35px;display:grid;place-items:center;background:var(--tint);border-radius:12px;color:var(--purple);font-size:25px;flex-shrink:0}.radio{width:18px;height:18px;border:1px solid #d6cddd;border-radius:50%;margin-left:auto;flex-shrink:0}.selected .radio{border:5px solid var(--purple)}.field{display:block;font-size:13px;font-weight:550;margin:20px 0 7px}input[type=text],input[type=email]{width:100%;height:53px;border-radius:12px;border:1px solid #dcd4e1;padding:13px;background:white;color:var(--ink)}.consent{display:flex;gap:10px;font-size:12px;line-height:1.5;margin:20px 0;color:var(--muted)}.consent input{width:19px;height:19px;flex-shrink:0;accent-color:var(--purple)}.notice{border-radius:14px;background:var(--tint);padding:17px;font-size:14px;margin:19px 0}.notice.green{background:#eaf3ed;color:var(--green)}.notice.amber{background:#f8eedf;color:var(--amber)}.notice.error{background:#f9e9eb;color:#a13a44}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:600;background:var(--tint);color:var(--purple)}.bigicon{width:62px;height:62px;display:grid;place-items:center;background:var(--tint);border-radius:21px;color:var(--purple);font-size:27px;margin:26px 0}.spacer{height:30px}.tabs{display:flex;flex-shrink:0;background:#fcfaf8f5;border-top:1px solid var(--line);padding:9px 15px 5px;gap:8px}.tabs button{flex:1;background:none;display:grid;justify-items:center;gap:3px;font-size:10px;color:#938897;padding:4px}.tabs .active{color:var(--purple)}svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.home{height:22px;flex-shrink:0;display:grid;place-items:center;background:var(--paper)}.home:after{content:"";width:118px;height:4px;border-radius:5px;background:#302a36}.camera{height:100%;min-height:100%;background:radial-gradient(ellipse at 60% 30%,#aaa899,#74796f 50%,#50584f);color:white;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}.camera:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,#ffffff09 20%,#ffffff09 21%,transparent 21%,transparent 73%,#182b1914 73%)}.camtitle{position:relative;align-self:stretch;padding:22px 23px;display:flex;justify-content:space-between;font-weight:600}.flash{background:#ffffff20;border-radius:50%;width:35px;height:35px;display:grid;place-items:center}.bottle{background:linear-gradient(100deg,#cfbadb,#ead9ed 50%,#c3abc9);width:105px;height:203px;border-radius:15px 15px 22px 22px;box-shadow:8px 10px 20px #17211c25;position:relative;display:grid;place-items:center;text-align:center;color:#63516b;flex-shrink:0}.bottle:before{content:"";position:absolute;top:-26px;width:67px;height:29px;background:linear-gradient(90deg,#827487,#a294a7,#827487);border-radius:7px 7px 0 0}.bottle span{font-family:Georgia,serif;font-size:20px}.bottle small{font:9px -apple-system,sans-serif;letter-spacing:1.2px;display:block;margin:8px 0}.bottle .barcode{position:absolute;bottom:28px;width:69px;height:34px;background:repeating-linear-gradient(90deg,#3b343d 0 1px,#f0e8f1 1px 3px,#3b343d 3px 5px,#f0e8f1 5px 6px);border:5px solid #f0e8f1}.scene{flex:1;display:grid;place-items:center;width:100%;position:relative}.frame{position:absolute;width:268px;height:144px;top:52%;border:2px solid #ffffffc7;border-radius:19px;box-shadow:0 0 0 1000px #15211618}.scanline{position:absolute;left:10px;right:10px;top:50%;height:1px;background:#ebe0ff;box-shadow:0 0 8px #fff}.camfoot{position:relative;padding:23px;width:100%;text-align:center}.camfoot p{font-size:14px}.camfoot .outline{background:#ffffffed;color:var(--ink);border:0}.product{display:flex;gap:19px;align-items:center;margin:6px 0 24px}.thumb{width:75px;height:95px;background:#f0e8f0;border-radius:17px;display:grid;place-items:center;flex-shrink:0}.thumb .bottle{transform:scale(.32);width:105px;height:203px;margin:-70px}.product h1{font-size:22px;margin:5px 0}.handle{width:35px;height:4px;background:#d9d2db;border-radius:5px;margin:1px auto 10px}.verdict{padding:17px;border-radius:16px;background:#f8eedf;color:#785421}.verdict h2{font-size:19px;margin:0 0 8px}.verdict p{font-size:13px;margin:0;line-height:1.5}.verdict.good{background:#e9f3ed;color:var(--green)}.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin:12px 0 19px}.legend span:before{content:"";display:inline-block;width:15px;height:8px;background:#e4eee6;border:1px solid var(--green);border-radius:3px;margin-right:4px}.legend span+span:before{width:7px;height:7px;background:var(--purple);border:0;border-radius:50%}.axis{margin-bottom:22px}.axishead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:11px}.axishead small{color:var(--amber);font-size:11px}.track{display:flex;gap:5px}.segment{height:11px;flex:1;background:#e9e3eb;border-radius:7px;position:relative}.segment.target{background:#e1ede4;border:1px solid var(--green)}.segment.dot:after{content:"";position:absolute;width:9px;height:9px;border:2px solid white;background:var(--purple);border-radius:50%;left:45%;top:-1px;box-sizing:content-box}.stops{display:flex;font-size:10px;color:var(--muted);margin-top:7px}.stops span{flex:1;text-align:center}.rows{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;margin:14px 0 22px}.row{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:16px 14px;border-bottom:1px solid var(--line);background:transparent;font-size:14px;gap:15px}.row:last-child{border-bottom:0}.row small{color:var(--muted);font-size:12px}.chev{color:#ac9db8}.profilehead{display:flex;gap:15px;align-items:center;margin:15px 0 25px}.avatar{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:#e9def1;color:var(--purple);font-family:Georgia,serif;font-size:25px}.profilehead h1{font-size:24px;margin:0 0 3px}.profilehead p{font-size:12px;margin:0;color:var(--muted)}.modalstage{min-height:590px;position:relative;background:#999b96;display:flex;align-items:center;justify-content:center;padding:28px}.iosdialog{border-radius:17px;background:#f2f1f2f7;text-align:center;box-shadow:0 15px 40px #0002;width:100%;overflow:hidden}.iosdialog h2{font-size:17px;margin:23px 20px 9px}.iosdialog p{font-size:13px;margin:0 20px 23px}.iosdialog button{width:100%;background:none;border-top:1px solid #cac6cc;color:#1765c1;padding:13px}.iosdialog button:last-child{font-weight:600}.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:40px auto 24px;animation:spin 1.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}.center{text-align:center}.notes{padding-top:18px}.notes h2{font-size:25px;line-height:1.2;margin:12px 0}.notes p{font-size:14px;line-height:1.65;color:#706774}.note-rule{height:1px;background:#d8d1d7;margin:23px 0}.notes .jump{border:1px solid #d8d1d7;padding:12px;margin:9px 0}.pill{font-size:10px;padding:6px 9px;border:1px solid #d8d1d7;border-radius:20px}.footerlabel{text-align:center;font-size:11px;color:#8b818f;margin-top:15px}.notification{border-radius:21px;padding:15px;background:#ffffffd9;box-shadow:0 8px 30px #0001;margin:90px 18px 20px;text-align:left}.notification .brand{font-size:17px;margin-bottom:10px}.lockscreen{height:100%;background:linear-gradient(140deg,#dacfe1,#9a87ab);padding-top:45px}.clock{text-align:center;font-size:64px;font-weight:200;color:white;letter-spacing:-3px}.notification p{font-size:14px;margin:4px 0}.notification .tiny{font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#302a36;color:white;z-index:10;font-size:13px;max-width:90vw}.toast:empty{display:none}@media(max-width:1000px){main{grid-template-columns:190px 393px;justify-content:center;gap:25px}.notes{grid-column:1/-1;max-width:610px;padding:0}.chapters{max-height:820px;overflow:auto}}@media(max-width:670px){header.board{padding:18px 20px}header .pill{display:none}main{display:flex;flex-direction:column;padding:16px 12px;align-items:center;gap:18px}.chapters{width:100%;max-height:none;display:flex;overflow:auto;gap:14px}.group{display:contents}.group h2{display:none}.jump{white-space:nowrap;width:auto;flex-shrink:0}.phone{width:min(393px,100%);height:800px;border-width:5px;border-radius:38px}.notes{width:100%;padding:5px 10px}.notes .jump{width:100%;white-space:normal}.board .brand{font-size:25px}}
@media(min-width:671px){.phone{margin:auto}.chapters{max-height:calc(100dvh - 170px);overflow:auto;scrollbar-width:thin}}@media(min-width:671px) and (max-height:950px){.phone{zoom:.82}}@media(min-width:671px) and (max-height:800px){.phone{zoom:.65}}
</style><link rel="stylesheet" href="web-alignment.css"><link rel="stylesheet" href="mobile-polish.css"></head><body>
<header class="board"><div><div class="brand">chaarlie <span style="font-size:13px;font-weight:400;letter-spacing:0;color:#82768b;margin-left:13px">iOS / Flow Review</span></div><p>Ein kurzer Weg vom Haar-Check zum passenden Produkt.</p></div><span class="pill">DESIGNENTWURF · MOBILE REFINEMENT</span></header>
<main><nav class="chapters" id="chapters" aria-label="Entwurfsszenarien"></nav><section><div class="phone"><div class="status"><span>9:41</span><span class="island"></span><span class="signals">▴ ▰</span></div><div id="screen" class="screen"></div><nav id="tabs" class="tabs" aria-label="App-Bereiche"></nav><div class="home"></div></div><div class="footerlabel">Klickbarer Entwurf · keine Kamera, keine echten Datenübertragungen</div></section><aside class="notes" id="notes"></aside></main><div id="toast" class="toast" role="status"></div>
<script src="web-alignment.js"></script>
<script>
(()=>{
const scanIcon='<svg viewBox="0 0 24 24"><path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M7 8v8m3-8v8m4-8v8m3-8v8"/></svg>';
const userIcon='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>';
const b=(label,to,cls='primary')=>`<button class="${cls}" data-go="${to}">${label}</button>`;
const top=(back='scan',label='Zurück')=>`<div class="top">${b('‹ '+label,back,'back')}</div>`;
const field=(label,value='',type='text')=>`<label class="field">${label}<input type="${type}" value="${value}" autocomplete="off"></label>`;
const row=(label,to,small='')=>`<button class="row" data-go="${to}"><span>${label}${small?`<br><small>${small}</small>`:''}</span><span class="chev">›</span></button>`;
const bottle=()=>'<div class="bottle"><span>MIRA<small>HAIR CARE</small></span><i class="barcode"></i></div>';
const product=(light=false)=>`<div class="product"><div class="thumb">${bottle()}</div><div><div class="eyebrow">MIRA</div><h1>${light?'Light':'Rich'} Haarmaske</h1><div class="tiny">Maske · 200 ml</div></div></div>`;
const axis=(name,stops,target,point)=>`<div class="axis"><div class="axishead"><b>${name}</b><small>${target===point?'Im Zielbereich':'Außerhalb deines Ziels'}</small></div><div class="track">${stops.map((_,i)=>`<span class="segment ${i===target?'target':''} ${i===point?'dot':''}"></span>`).join('')}</div><div class="stops">${stops.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
const opts=(arr,next)=>arr.map((x,i)=>`<button class="option" ${next?`data-go="${next}"`:'data-select="true"'}><span class="symbol">${['〰','≈','∿','≋'][i]}</span><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="radio"></span></button>`).join('');
const pad=(html)=>`<div class="pad">${html}</div>`;
const screens={
quiz:{group:'01 Einstieg',label:'Haar-Check',title:'Vertrauter Quiz-Einstieg',note:'Direkt nach der Installation beginnt der reguläre Haar-Check. Bestehende Nutzer können sich oben anmelden. Hier sind die ersten drei Fragen exemplarisch dargestellt; der vollständige Ablauf bleibt bei zehn Fragen.',links:[['Zum Quiz-Ende springen','email'],['Bestehendes Konto','login']],html:()=>pad(`<div class="top"><span class="brand">chaarlie</span>${b('Schon dabei? Anmelden','login','textbtn')}</div><div class="tiny" style="text-align:right">1 / 10</div><div class="progress"><span style="width:10%"></span></div><h1 class="serif">Welche Haarstruktur haben die meisten deiner Haare?</h1><p class="sub">Betrachte deine natürliche Haarform.</p>${opts([['Glatt','Die Strähne hängt glatt runter'],['Wellig','Bildet eine S-Kurve, keine 3D-Windung'],['Lockig','Formt sich zu einer deutlichen 3D-Locke'],['Kraus','Enge Windungen, die sich in sich selbst drehen']],'quiz2')}<p class="tiny" style="margin-top:19px">Kostenlos scannen. Ohne Abo.</p>`)},
quiz2:{group:null,label:'Haardicke',title:'Ein Schritt pro Frage',note:'Die Frage bleibt inhaltlich am Web-Quiz orientiert. Eine einzelne Antwort führt direkt weiter. Mehrfachauswahl-Fragen behalten eine explizite Weiter-Aktion.',links:[['Zum Quiz-Ende springen','email']],html:()=>pad(`${top('quiz')}<div class="tiny" style="text-align:right">2 / 10</div><div class="progress"><span style="width:20%"></span></div><h1 class="serif">Wie dick fühlt sich ein einzelnes Haar bei dir meistens an?</h1><p class="sub">Vergleiche ein einzelnes Haar mit einem Nähfaden.</p>${opts([['Fein','Kaum spürbar – dünner als ein Nähfaden'],['Mittel','Spürbar – ähnlich wie ein Nähfaden'],['Dick','Deutlich spürbar – dicker als ein Nähfaden']],'quiz3')}`)},
quiz3:{group:null,label:'Haardichte',title:'Gleiche Frage, mobiles Layout',note:'Diese Ansicht nimmt die aktuell live sichtbare Frage auf. Hier endet der Quiz-Ausschnitt des Mockups. Die übrigen sieben Fragen werden in der App nicht übersprungen.',links:[['Restliche Fragen im Entwurf überspringen','email']],html:()=>pad(`${top('quiz2')}<div class="tiny" style="text-align:right">3 / 10</div><div class="progress"><span style="width:30%"></span></div><h1 class="serif">Wie dicht ist dein Haar insgesamt?</h1><p class="sub">Schau zum Beispiel auf Scheitel, Zopf-Umfang und wie viel Kopfhaut sichtbar ist.</p>${opts([['Wenig Haare','Der Scheitel wirkt breiter oder die Kopfhaut scheint schnell durch.'],['Mittlere Dichte','Du hast weder auffällig wenig noch auffällig viele Haare.'],['Viele Haare','Dein Haar fühlt sich insgesamt voll an, ein Zopf wirkt eher dick.']])}`)},
email:{group:'01 Einstieg',label:'Quiz fertig → E-Mail',title:'Die E-Mail kommt am Schluss',note:'Nach allen zehn Fragen: Name, E-Mail und freiwillige Marketing-Einwilligung. Die neue Copy verspricht keinen Haarbericht. Alle Eingaben und Bestätigungen in diesem Entwurf sind simuliert.',links:[['Code abgelaufen','codeerror']],html:()=>pad(`${top('quiz3')}<span class="badge">Haar-Check abgeschlossen</span><h1>Deine Angaben stehen.<br>Jetzt kannst du scannen.</h1><p class="sub">Verknüpfe deine Haarangaben mit deinem Konto. So können wir Produkte passend zu dir einschätzen.</p>${field('Vorname','Lea')}${field('E-Mail-Adresse','lea@example.com','email')}<label class="consent"><input type="checkbox"><span>Ich möchte Produkt-News und Angebote per E-Mail erhalten. Optional, jederzeit abbestellbar.</span></label>${b('E-Mail bestätigen','code')}<p class="tiny center">Wir senden dir einen Anmeldelink und einen Code.</p>${b('Datenschutz ansehen','privacy','textbtn')}`)},
login:{group:'01 Einstieg',label:'Bestehendes Konto',title:'Web-Nutzer melden sich an',note:'Die E-Mail aus dem abgeschlossenen Web-Quiz reicht als Einstieg. Nach Verifizierung verwenden wir das vorhandene Konto und Haarprofil. App-Installation allein überträgt keinen Login.',links:[['Link öffnet anderes Konto','switchaccount'],['Profil konnte nicht geladen werden','linkerror'],['Tatsächlich kein Quiz vorhanden','noquiz']],html:()=>pad(`${top('quiz')}<div class="bigicon">↗</div><h1>Schön, dass du da bist.</h1><p class="sub">Melde dich mit der E-Mail-Adresse an, die du für deinen Haar-Check verwendet hast.</p>${field('E-Mail-Adresse','lea@example.com','email')}${b('Anmeldelink und Code senden','code')}<p class="tiny center">Kein Passwort nötig.</p>${b('Noch keinen Haar-Check gemacht?','quiz','textbtn')}`)},
code:{group:'01 Einstieg',label:'E-Mail bestätigen',title:'Link oder Code → Scanner',note:'Der Link in derselben E-Mail führt direkt in die installierte App. Als gleichwertiger Fallback bleibt das Codefeld. Die genaue Codelänge folgt später dem Auth-Vertrag, deshalb keine festgelegten Kästchen.',links:[['Ungültiger / abgelaufener Code','codeerror'],['Erfolgreicher Link, schon Kamerazugriff','scan']],html:()=>pad(`${top('login')}<div class="bigicon">✉</div><h1>Einmal kurz bestätigen.</h1><p class="sub">Öffne den Anmeldelink in der E-Mail an <b>lea@example.com</b> oder gib den Code hier ein.</p>${field('Code aus der E-Mail')}${b('Bestätigen und scannen','permission')}<div style="margin-top:16px">${b('E-Mail erneut senden','resent','textbtn')}<br>${b('Andere E-Mail verwenden','login','textbtn')}</div>`)},
resent:{group:null,label:'E-Mail erneut gesendet',title:'Neuer Versuch',note:'Resend benötigt später einen sichtbaren Cooldown und Rate Limits. Die alte Verifikationsnachricht darf keine zweite gültige Anmeldung erzeugen.',links:[['Zum Codefeld','code']],html:()=>pad(`${top('code')}<div class="notice green"><h3>E-Mail erneut gesendet</h3>Verwende den Link oder Code aus der neuesten E-Mail.</div>${b('Code eingeben','code')}`)},
codeerror:{group:null,label:'Code ungültig',title:'Verifizierung lässt sich wiederholen',note:'Ein ungültiger, abgelaufener oder bereits verwendeter Code führt nicht zurück durch den Quiz. Die Angaben bleiben für einen erneuten Verifikationsversuch erhalten.',links:[['Erfolgreich bestätigt','permission']],html:()=>pad(`${top('login')}<h1>E-Mail bestätigen</h1><p class="sub">Für lea@example.com</p>${field('Code aus der E-Mail')}<div class="notice error">Dieser Code ist ungültig oder abgelaufen. Prüfe die neueste E-Mail oder lass dir einen neuen Code senden.</div>${b('Erneut bestätigen','permission')}${b('Neue E-Mail senden','resent','outline')}`)},
permission:{group:'02 Scannen',label:'Erste Kamerafreigabe',title:'Keine Seite zwischen Quiz und Scan',note:'Nach erfolgreicher Anmeldung erscheint beim ersten Scan die Systemfreigabe. Die Darstellung ist schematisch; die endgültige iOS-Systemoberfläche kontrolliert Apple. Bereits erteilte Freigabe: direkt Kamera.',links:[['Kamera abgelehnt','denied']],html:()=>`<div class="modalstage"><div class="iosdialog"><h2>„Chaarlie“ möchte auf deine Kamera zugreifen</h2><p>Scanne den Barcode eines Haarpflegeprodukts, um zu sehen, wie es zu deinen Haarangaben passt.</p>${b('Nicht erlauben','denied','')}${b('Erlauben','scan','')}</div></div>`},
scan:{group:'02 Scannen',label:'Scanner',tab:'scan',title:'Aufmachen. Barcode hinhalten.',note:'Die Kamera startet sofort, sobald Scan aktiv ist und die Freigabe vorliegt. Es gibt keinen Auslöser. Die Szenario-Schaltflächen unten simulieren die automatische Erkennung; sie gehören nicht in die App.',links:[['Bekannten Barcode erkennen','loading'],['Unbekannten Barcode erkennen','unknown'],['Verbindung fällt nach Erkennung aus','offline'],['Kamera wurde abgelehnt','denied']],html:()=>`<div class="camera"><div class="camtitle"><span>Produkt scannen</span><button class="flash" data-toast="Taschenlampe in dieser Vorschau simuliert" aria-label="Taschenlampe">ϟ</button></div><div class="scene">${bottle()}<div class="frame"><div class="scanline"></div></div></div><div class="camfoot"><p>Halte den Barcode in den Rahmen.</p>${b('Produkt manuell suchen','search','outline')}</div></div>`},
loading:{group:null,label:'Produkt wird geladen',tab:'scan',title:'Erkannt, jetzt wird nachgeschlagen',note:'Nach der Erkennung pausiert der Scanner, damit derselbe Barcode nicht mehrfach auslöst. Hier bleibt der Ladezustand zur Prüfung stehen; in der App führt der Server-Antwortstatus weiter.',links:[['Bewertung verfügbar','result'],['Produkt fehlt','unknown'],['Netzwerkfehler','offline']],html:()=>pad(`${top()}<div class="spinner"></div><h1 class="center">Produkt erkannt</h1><p class="sub center">Wir laden deine Einschätzung.</p><div class="notice center">Barcode<br><b>4000000000006</b></div>`)},
result:{group:'02 Scannen',label:'Persönliche Bewertung',tab:'scan',title:'Eine Antwort mit Substanz',note:'Fiktives MIRA-Produkt und illustrative Bewertung, keine neue Bewertungslogik. Erst das Urteil, dann Produkt und Zielbereich, Erklärung, Alternativen und Shop. Der Inhalt scrollt innerhalb des Telefons.',links:[['Passende Alternative öffnen','alternative'],['Weiter scannen','scan']],html:()=>pad(`<div class="handle"></div><div class="top" style="margin-bottom:10px">${b('‹ Scan','scan','back')}<span class="tiny">Deine Einschätzung</span>${b('✕','scan','textbtn')}</div>${product()}<div class="verdict"><h2>Passt mit Einschränkung</h2><p>Für deine Längen interessant, für dein feines Haar möglicherweise zu schwer.</p></div><h2>Produkt und Haar im Vergleich</h2><div class="legend"><span>Dein Zielbereich</span><span>Dieses Produkt</span></div>${axis('Pflegewirkung',['Leicht','Mittel','Reichhaltig'],0,2)}${axis('Geeignete Haardicke',['Fein','Normal','Dick'],0,1)}<h2>Was das für dich bedeutet</h2><p class="sub">Deine gefärbten Längen können von Pflege profitieren. Dein feines Haar braucht dabei jedoch wenig Gewicht. Diese Maske liegt über deinem Zielbereich.</p><h2>Diese passt besser zu dir</h2><div class="rows">${row('MIRA · Light Haarmaske','alternative','Leichte Pflege · 200 ml')}</div><button class="outline" data-toast="Im fertigen Produkt öffnet sich hier der hinterlegte Händler.">Im Shop ansehen ↗</button>${b('Weiter scannen','scan')}`)},
alternative:{group:null,label:'Alternative',tab:'scan',title:'Alternative ohne Umweg',note:'Eine verfügbare Alternative öffnet dieselbe Art von Produktbewertung. Es entsteht keine Merkliste und kein Routine-Schritt. Illustrative Daten, keine zugesicherte echte Empfehlung.',links:[['Zur gescannten Maske','result']],html:()=>pad(`${top('result')}${product(true)}<div class="verdict good"><h2>Passt zu deinem Haar</h2><p>Leichte Pflege für dein feines Haar.</p></div><h2>Produkt und Haar im Vergleich</h2><div class="legend"><span>Dein Zielbereich</span><span>Dieses Produkt</span></div>${axis('Pflegewirkung',['Leicht','Mittel','Reichhaltig'],0,0)}${axis('Geeignete Haardicke',['Fein','Normal','Dick'],0,0)}<h2>Was das für dich bedeutet</h2><p class="sub">Die leichte Pflege liegt im Zielbereich deiner Haarangaben.</p><button class="outline" data-toast="Externer Händler wird hier nur simuliert.">Im Shop ansehen ↗</button>${b('Weiter scannen','scan')}`)},
search:{group:'02 Scannen',label:'Manuelle Suche',tab:'scan',title:'Auch ohne Kamerazugriff nutzbar',note:'Manuelle Suche nach Produktname, Marke oder Barcode. Die Treffer sind hier fest vorgegeben. Kein fehlendes Produkt wird allein aus einem geratenen Namen als geprüft ausgegeben.',links:[['Keine Treffer','empty']],html:()=>pad(`${top()}<h1>Produkt suchen</h1>${field('Produktname, Marke oder Barcode','MIRA')}<h2>Produkte</h2><div class="rows">${row('MIRA · Rich Haarmaske','result','Maske · 200 ml')}${row('MIRA · Light Haarmaske','alternative','Maske · 200 ml')}</div>`)},
empty:{group:null,label:'Keine Treffer',tab:'scan',title:'Kein Treffer ist kein Urteil',note:'Für eine neue Einreichung wird ein Barcode benötigt. Produktnamen allein starten keine Recherche. Validierung und unterstützte Barcodetypen werden aus dem bestehenden Scanner übernommen.',links:[['Barcode bekannt','unknown']],html:()=>pad(`${top('search')}<h1>Kein Produkt gefunden</h1><p class="sub">Versuche es mit einer anderen Schreibweise oder gib den Barcode von der Verpackung ein.</p>${field('Barcode','4000000000006')}${b('Barcode prüfen','unknown')}`)},
denied:{group:null,label:'Kamera nicht erlaubt',tab:'scan',title:'Ablehnen führt nicht in eine Sackgasse',note:'Die App fragt nach einer Ablehnung nicht bei jedem Besuch erneut. Manuelle Suche bleibt zugänglich. Einstellungen öffnet später die System-Einstellungen; hier wird die Rückkehr mit Freigabe simuliert.',links:[['Zurück mit freigegebener Kamera','scan']],html:()=>pad(`<div class="top"><span class="brand">chaarlie</span></div><div class="bigicon">${scanIcon}</div><h1>Scannen braucht deine Kamera.</h1><p class="sub">Erlaube den Kamerazugriff in den Einstellungen. Du kannst ein Produkt auch manuell suchen.</p>${b('Produkt manuell suchen','search') }<button class="outline" data-toast="Die App öffnet hier ihre iOS-Einstellungen. Rückkehr über die Szenario-Auswahl.">Einstellungen öffnen</button>`)},
offline:{group:null,label:'Verbindung unterbrochen',tab:'scan',title:'Barcode behalten, erneut versuchen',note:'Keine Offline-Einschätzung. Der erkannte Barcode bleibt für den erneuten Versuch erhalten. Es ist kein zweiter Scan nötig. Die Wiederholen-Aktion zeigt im Entwurf den erfolgreichen Fall.',links:[['Wiederholen erfolgreich','result']],html:()=>pad(`${top()}<div class="bigicon">↻</div><h1>Gerade keine Verbindung.</h1><p class="sub">Dein Barcode ist erkannt. Sobald du wieder online bist, können wir das Produkt nachschlagen.</p><div class="notice">Barcode <b>4000000000006</b></div>${b('Erneut versuchen','result')}${b('Anderes Produkt scannen','scan','outline')}`)},
unknown:{group:'03 Unbekanntes Produkt',label:'Produktart auswählen',tab:'scan',title:'Eine Auswahl reicht zur Einreichung',note:'Der Barcode wurde erkannt, das Produkt ist noch nicht bewertbar. Die Auswahl der Produktart reicht das Produkt direkt ein, wie im aktuellen Scanner. Keine zusätzlichen Pflichtfelder für Marke oder Namen.',links:[['Einreichung fehlgeschlagen','submiterror']],html:()=>pad(`${top()}<span class="badge">Neu für uns</span><h1>Was für ein Produkt ist das?</h1><p class="sub">Das Produkt fehlt noch bei uns. Wähle die Produktart, um es zur Prüfung einzureichen.</p><p class="tiny">Barcode 4000000000006</p><div class="rows">${['Shampoo','Conditioner','Leave-in','Maske','Öl'].map(c=>row(c,'submitted')).join('')}</div><p class="tiny">Wir benachrichtigen dich, sobald deine Einschätzung bereit ist.</p>`)},
submitted:{group:'03 Unbekanntes Produkt',label:'Eingereicht + Push',tab:'scan',title:'Zurück zum Scannen ist immer möglich',note:'Erst nach erfolgreicher Einreichung bieten wir Push an. Email ist ebenfalls vorgesehen, nicht erst bei Push-Fehlern. Die optionale Aktion öffnet die Systemfreigabe. Kein Verlauf oder zusätzlicher Tab.',links:[['Push-Systemfreigabe','pushpermission'],['Spätere Ergebnis-Benachrichtigung','notification']],html:()=>pad(`${top()}<div class="bigicon">✓</div><h1>Produkt eingereicht.</h1><p class="sub">Wir prüfen die Produktdaten und schicken dir eine E-Mail, sobald deine Einschätzung bereit ist.</p><div class="notice"><h3>Direkt auf deinem iPhone erfahren?</h3><p class="sub" style="margin-bottom:10px">Lass dich zusätzlich per Mitteilung benachrichtigen.</p>${b('Mitteilungen aktivieren','pushpermission','outline')}</div>${b('Weiter scannen','scan')}`)},
pushpermission:{group:null,label:'Push erlauben',title:'Kontext statt Startbildschirm-Prompt',note:'Schematische Systemfreigabe. Ablehnen blockiert weder Recherche noch weitere Scans. Bei bereits erlaubten Mitteilungen entfällt dieser Prompt.',links:[['Ergebnis später bereit','notification']],html:()=>`<div class="modalstage"><div class="iosdialog"><h2>„Chaarlie“ möchte dir Mitteilungen senden</h2><p>Mitteilungen können Hinweise, Töne und Symbolkennzeichen enthalten.</p>${b('Nicht erlauben','scan','')}${b('Erlauben','scan','')}</div></div>`},
submiterror:{group:null,label:'Einreichen fehlgeschlagen',tab:'scan',title:'Nicht fälschlich als eingereicht bestätigen',note:'Bei einem fehlgeschlagenen Request bleibt Barcode plus Auswahl erhalten. Erneute Versuche müssen technisch dedupliziert werden; Copy und Zustand zeigen bis zum Erfolg keine laufende Recherche.',links:[['Erneut versuchen','submitted']],html:()=>pad(`${top('unknown')}<h1>Das hat noch nicht geklappt.</h1><p class="sub">Wir konnten dein Produkt nicht einreichen. Bitte versuche es noch einmal.</p><div class="notice">Maske<br>Barcode 4000000000006</div>${b('Erneut einreichen','submitted')}${b('Weiter scannen','scan','outline')}`)},
notification:{group:'03 Unbekanntes Produkt',label:'Ergebnis ist bereit',title:'Die Nachricht ist der Rückweg',note:'Illustrativer Push auf dem Sperrbildschirm. Parallel geht eine E-Mail mit demselben Produktziel raus. Erst eine tatsächlich nutzbare Bewertung löst die Nachricht aus. Ohne aktive Anmeldung wird das Ziel durch Login bewahrt.',links:[['Push öffnen, noch angemeldet','result'],['Push öffnen, erneut anmelden','notificationlogin']],html:()=>`<div class="lockscreen"><div class="center" style="color:white">Donnerstag, 10. September</div><div class="clock">09:41</div><button class="notification" data-go="result"><div class="brand">chaarlie <span class="tiny" style="float:right;font:11px sans-serif">jetzt</span></div><b>Deine Produkteinschätzung ist da.</b><p>Sieh nach, wie die MIRA Rich Haarmaske zu deinen Haarangaben passt.</p></button></div>`},
notificationlogin:{group:null,label:'Ergebnis nach Login',title:'Das Produktziel geht nicht verloren',note:'Verkürzte Vorschau des bekannten E-Mail-/Code-Logins. Nach erfolgreicher Verifikation landet der Nutzer beim angefragten Produkt statt auf der Kamera. Kein zusätzlicher Inbox-Bereich.',links:[['Verifizierung erfolgreich','result']],html:()=>pad(`${top('notification')}<h1>Deine Einschätzung wartet.</h1><p class="sub">Melde dich an, um die Bewertung für dein Produkt zu öffnen.</p>${field('E-Mail-Adresse','lea@example.com','email')}${b('Anmeldelink und Code senden','notificationcode')}`)},
notificationcode:{group:null,label:'Ergebnis-Login Code',title:'Anmelden und beim Produkt landen',note:'Diese Verifizierung bewahrt den Ziel-Link. Der Klick simuliert erfolgreichen Login mit passendem Konto und gültigem Quiz.',links:[['Produkt öffnen','result']],html:()=>pad(`${top('notificationlogin')}<h1>E-Mail bestätigen</h1><p class="sub">Gib den Code für lea@example.com ein.</p>${field('Code aus der E-Mail')}${b('Bestätigen und Einschätzung öffnen','result')}`)},
profile:{group:'04 Profil',label:'Profil',tab:'profile',title:'Das Konto bleibt übersichtlich',note:'Zweiter und letzter Tab. Haarangaben, Konto und Hilfe. Keine Synthese, Routine oder gespeicherten Produkte. Benachrichtigungspräferenzen benötigen noch Abgleich mit der bestehenden Einwilligungslogik.',links:[['Haarangaben bearbeiten','edit'],['Löschbestätigung','delete']],html:()=>pad(`<div class="top"><span class="brand">chaarlie</span></div><div class="profilehead"><div class="avatar">L</div><div><h1>Hallo, Lea.</h1><p>lea@example.com</p></div></div><div class="rows">${row('Meine Haarangaben','answers','Deine Antworten aus dem Haar-Check')}</div><h2>Konto & Hilfe</h2><div class="rows">${row('E-Mail-Adresse ändern','changeemail')}${row('Hilfe & Kontakt','help')}${row('Datenschutz','privacy')}</div>${b('Abmelden','logout','outline')}${b('Konto löschen','delete','textbtn danger')}`)},
answers:{group:'04 Profil',label:'Haarangaben',tab:'profile',title:'Antworten, keine erfundene Haaranalyse',note:'Beispielauszug gespeicherter Antworten. Die fertige Ansicht zeigt alle relevanten Quizantworten. Aktualisieren öffnet den vorausgefüllten regulären Quiz; erst vollständiges Speichern ersetzt die gemeinsame Grundlage.',links:[['Bearbeiten öffnen','edit']],html:()=>pad(`${top('profile')}<h1>Meine Haarangaben</h1><p class="sub">Diese Angaben verwenden wir, um Produkte für dich einzuschätzen.</p><div class="rows">${[['Haarstruktur','Wellig'],['Haardicke','Fein'],['Haardichte','Mittlere Dichte'],['Haarlänge','Schulterlang'],['Behandlung','Gefärbt / getönt'],['Haarprobleme','Trockene Längen']].map(([a,c])=>`<div class="row"><span>${a}</span><small>${c}</small></div>`).join('')}</div>${b('Haarangaben aktualisieren','edit')}<p class="tiny">Änderungen gelten auch auf der Website.</p>`)},
edit:{group:'04 Profil',label:'Angaben aktualisieren',tab:'profile',title:'Bestehende Antworten vorausfüllen',note:'Repräsentativer Bearbeitungsschritt. Auswahl wird lokal im Entwurf markiert. Die Szenario-Aktion simuliert das vollständige Durchlaufen und Speichern des Quiz. Abbrechen verwirft die Änderungen.',links:[['Vollständigen Quiz speichern simulieren','saved'],['Abbrechen, Angaben behalten','answers']],html:()=>pad(`${top('answers','Abbrechen')}<div class="tiny">2 / 10 · Angaben aktualisieren</div><h1 class="serif">Wie dick fühlt sich ein einzelnes Haar bei dir meistens an?</h1><p class="sub">Vergleiche ein einzelnes Haar mit einem Nähfaden.</p>${opts([['Fein','Kaum spürbar – dünner als ein Nähfaden'],['Mittel','Spürbar – ähnlich wie ein Nähfaden'],['Dick','Deutlich spürbar – dicker als ein Nähfaden']]).replace('class="option"','class="option selected"')}`)},
saved:{group:null,label:'Angaben gespeichert',tab:'profile',title:'Erst nach vollständigem Speichern gültig',note:'Erfolg erst anzeigen, wenn der gemeinsame Profilkontext für neue Bewertungen aktualisiert ist. Das Backend-Refresh-Verhalten muss vor Umsetzung verifiziert werden.',links:[['Zurück zum Scanner','scan']],html:()=>pad(`${top('profile')}<div class="notice green"><h3>Haarangaben aktualisiert</h3>Neue Einschätzungen berücksichtigen deine aktuellen Angaben – in der App und auf der Website.</div>${b('Produkt scannen','scan')}`)},
changeemail:{group:null,label:'E-Mail ändern',tab:'profile',title:'Eine Identität für App und Website',note:'Diese Ansicht zeigt den Einstieg. Die konkrete Verifikation der alten/neuen E-Mail sowie Konfliktfälle folgen dem noch zu prüfenden bestehenden Auth-Vertrag. Kein unbestätigter Kontowechsel.',links:[['Zurück zum Profil','profile']],html:()=>pad(`${top('profile')}<h1>E-Mail-Adresse ändern</h1><p class="sub">Deine neue Adresse gilt für die App und die Website. Wir bestätigen die Änderung per E-Mail.</p><p class="tiny">Aktuell: lea@example.com</p>${field('Neue E-Mail-Adresse','','email')}<button class="primary" data-toast="Verifikationsablauf noch mit bestehendem Kontosystem abzugleichen. Es wird keine E-Mail versendet.">Änderung bestätigen</button>`)},
delete:{group:'04 Profil',label:'Konto löschen',tab:'profile',title:'Konsequenz für das gesamte Konto',note:'Die Löschung betrifft auch die Website. Gezeigt ist der Fall mit möglichem bestehenden Web-Abo. Reauth, aktive Verträge, Datenaufbewahrung und Fehlerbehandlung müssen am Backend geprüft werden. Nichts wird wirklich gelöscht.',links:[['Abo-Kündigung schlägt fehl','deleteerror']],html:()=>pad(`${top('profile')}<h1>Konto wirklich löschen?</h1><p class="sub">Du löschst dein Chaarlie-Konto und deine Haarangaben – in der App und auf der Website. Das kann nicht rückgängig gemacht werden.</p><div class="notice amber"><h3>Auch dein Website-Zugang endet.</h3><p style="margin:0">Falls du ein Web-Abo hast, beenden wir dessen künftige Verlängerungen im Rahmen der Löschung.</p></div><p class="tiny">Daten, die wir gesetzlich aufbewahren müssen, bleiben für die vorgeschriebene Dauer gespeichert. Eine Löschung löst keine automatische Rückerstattung aus.</p>${b('Konto behalten','profile','outline')}<button class="primary danger" data-toast="Nur Entwurf. Keine Löschung ausgeführt. Die endgültige Bestätigung kann eine erneute Anmeldung verlangen.">Konto endgültig löschen</button>`)},
deleteerror:{group:null,label:'Löschung noch nicht möglich',tab:'profile',title:'Keine verwaiste Abrechnung erzeugen',note:'Solange die Beendigung weiterer Web-Verlängerungen nicht geklärt ist, darf die Kontoverknüpfung nicht voreilig gelöscht werden. Konkreter Recovery-Vertrag ist noch zu prüfen.',links:[['Zurück zur Löschbestätigung','delete']],html:()=>pad(`${top('profile')}<h1>Dein Konto wurde noch nicht gelöscht.</h1><p class="sub">Wir konnten die Verlängerung deines Web-Abos gerade nicht beenden. Versuche es bitte erneut.</p>${b('Erneut versuchen','delete')}${b('Hilfe erhalten','help','outline')}`)},
linkerror:{group:null,label:'Profil laden fehlgeschlagen',title:'Technischer Fehler ist kein fehlender Quiz',note:'Bei einem Lade- oder Verknüpfungsfehler erneut versuchen und Hilfe anbieten. Keine erneute Befragung und kein neuer Account als vermeintliche Reparatur.',links:[['Erneut laden erfolgreich','scan']],html:()=>pad(`${top('login')}<h1>Deine Haarangaben konnten nicht geladen werden.</h1><p class="sub">Du bist angemeldet. Bitte versuche es noch einmal.</p>${b('Erneut versuchen','scan')}${b('Hilfe erhalten','help','outline')}`)},
noquiz:{group:null,label:'Kein abgeschlossener Quiz',title:'Nur bei nachweislich fehlenden Angaben',note:'Die Verifizierung kann erfolgreich sein, obwohl zu diesem Konto noch kein vollständiger Quiz existiert. Zugang zum Scanner bleibt dann aus, bis gültige Antworten vorhanden sind.',links:[['Quiz starten','quiz']],html:()=>pad(`<div class="bigicon">〰</div><h1>Uns fehlen noch deine Haarangaben.</h1><p class="sub">Für lea@example.com ist noch kein vollständiger Haar-Check hinterlegt.</p>${b('Haar-Check starten','quiz')}${b('Andere E-Mail verwenden','login','outline')}`)},
switchaccount:{group:null,label:'Anderes Konto im Link',title:'Konten nicht still zusammenführen',note:'Illustrativer Konflikt bei einem Link für ein anderes Konto. Keine automatische Übernahme fremder Antworten. Abbrechen behält das aktuelle Konto.',links:[['Beim bisherigen Konto bleiben','scan']],html:()=>pad(`${top()}<h1>Konto wechseln?</h1><p class="sub">Du bist als lea@example.com angemeldet. Dieser Anmeldelink gehört zu alex@example.com.</p><div class="notice">Beim Wechsel verwenden wir die Haarangaben des anderen Kontos.</div>${b('Bei Lea bleiben','scan','outline')}${b('Zu Alex wechseln','scan')}`)},
logout:{group:null,label:'Abgemeldet',title:'Zurück zur Anmeldung',note:'Abmelden entfernt die aktive Sitzung, löscht aber weder Konto noch Haarangaben. Push-Token-Zuordnung muss technisch an die Sitzung gebunden werden.',links:[['Wieder anmelden','login']],html:()=>pad(`<div class="bigicon">✓</div><h1>Du bist abgemeldet.</h1><p class="sub">Deine Haarangaben bleiben in deinem Konto gespeichert.</p>${b('Wieder anmelden','login')}`)},
help:{group:null,label:'Hilfe & Kontakt',tab:'profile',title:'Ein einfacher Support-Einstieg',note:'Kontaktziel wird vor Umsetzung gegen den bestehenden Supportkanal geprüft. Die Vorschau sendet keine Nachricht.',links:[['Zurück zum Profil','profile']],html:()=>pad(`${top('profile')}<h1>Wie können wir helfen?</h1><p class="sub">Schreib uns, wenn etwas beim Scannen oder mit deinem Konto nicht funktioniert.</p><button class="primary" data-toast="Supportkontakt im Entwurf. Keine Nachricht versendet.">Support kontaktieren</button>`)},
privacy:{group:null,label:'Datenschutz',title:'Vorhandene Rechtstexte einbinden',note:'Der fertige Ablauf öffnet die aktuelle Datenschutzerklärung mit den Ergänzungen für die App. Die Vorschau erfindet keinen vollständigen Rechtstext.',links:[['Zurück zum Profil','profile'],['Zurück zur E-Mail-Erfassung','email']],html:()=>pad(`${top('profile')}<h1>Datenschutz</h1><p class="sub">Hier öffnet sich die aktuelle Datenschutzerklärung von Chaarlie.</p><p class="tiny">Platzhalter für die Designprüfung.</p>`)}
};
window.alignWebMockup(screens,b,bottle);
let active='scan';
function render(id){if(!screens[id])return;active=id;const s=screens[id];document.getElementById('screen').innerHTML=s.html();document.getElementById('screen').scrollTop=0;document.getElementById('tabs').style.display=s.tab?'flex':'none';document.getElementById('tabs').innerHTML=`<button data-go="scan" class="${s.tab==='scan'?'active':''}">${scanIcon}Scan</button><button data-go="profile" class="${s.tab==='profile'?'active':''}">${userIcon}Profil</button>`;document.getElementById('notes').innerHTML=`<div class="eyebrow">${s.group||'Weiterer Zustand'}</div><h2>${s.title}</h2><p>${s.note}</p><div class="note-rule"></div><div class="eyebrow">Im Entwurf weitergehen</div>${s.links.map(([l,t])=>b(l+' →',t,'jump')).join('')}<div class="note-rule"></div><p class="tiny">Alle Konten, Produkte und Bewertungen sind Beispieldaten. Diese Navigation gehört zur Designprüfung, nicht in die App.</p>`;document.querySelectorAll('#chapters [data-go]').forEach(x=>{if(x.dataset.go===id)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});document.getElementById('toast').textContent='';history.replaceState(null,'','#'+id);}
const groups=[...new Set(Object.values(screens).map(s=>s.group).filter(Boolean))];document.getElementById('chapters').innerHTML=groups.map(g=>`<div class="group"><h2>${g}</h2>${Object.entries(screens).filter(([_,s])=>s.group===g).map(([id,s],i)=>`<button class="jump" data-go="${id}"><span class="num">${String(i+1).padStart(2,'0')}</span>${s.label}</button>`).join('')}</div>`).join('');
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.id==='viewsize'){const full=document.querySelector('.phone').classList.toggle('fullsize');button.textContent=full?'Ans Fenster anpassen':'Originalgröße';return;}if(button.dataset.go)render(button.dataset.go);if(button.dataset.select){button.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));button.classList.add('selected')}if(button.dataset.toast){document.getElementById('toast').textContent=button.dataset.toast}});render(screens[location.hash.slice(1)]?location.hash.slice(1):active);
})();
</script></body></html>
