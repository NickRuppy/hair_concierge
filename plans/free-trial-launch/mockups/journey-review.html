<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaarlie · Letzter Ablauf-Check</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeaf0;color:#2a1845;font:14px/1.5 system-ui,sans-serif}.review{max-width:1240px;margin:auto;padding:24px}.review h1{font-size:21px;margin:0 0 6px}.review p{margin:0;color:#6a6560;max-width:920px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}button,select{font:600 12px system-ui;min-height:38px;border:1px solid #d6cfe1;border-radius:8px;padding:8px 12px;color:#594172;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#2a1845;border-color:#2a1845;color:white}select{max-width:100%;background:white}.preview{padding:0 16px 32px}iframe{display:block;margin:auto;width:390px;max-width:100%;height:844px;border:1px solid #ded8e4;border-radius:12px;background:#fbfaf9;box-shadow:0 12px 40px #2a184510}.desktop iframe{width:1240px}.note{font-size:13px;max-width:760px;padding:16px;margin:auto;color:#594f63}.step{font-size:12px;color:#736f69;margin-left:auto}@media(max-width:440px){.review{padding:18px 16px}.preview{padding:0}iframe{width:100%;border-radius:0;border-left:0;border-right:0}}</style></head><body><header class="review"><h1>Die letzten Schritte nach dem Teststart</h1><p>Kündigung, Planwechsel und Zahlung. Statische Entwürfe mit Beispieldaten; Konto- und Zahlungsschaltflächen führen keine Aktionen aus.</p><div class="toolbar"><select id="state" aria-label="Ansicht auswählen"></select><button id="prev" aria-label="Vorherige Ansicht">←</button><button id="next" aria-label="Nächste Ansicht">Weiter →</button><span class="step" id="count"></span></div><div class="toolbar"><button id="mobile" aria-pressed="true">Mobil · 390 px</button><button id="desktop" aria-pressed="false">Desktop</button></div></header><div class="preview" id="preview"><iframe title="Ansicht des Kundenablaufs"></iframe><p class="note" id="note"></p></div><script>const states=[{"key": "cancel-confirm", "label": "1 · Kündigung bestätigen", "group": "Kündigung", "note": "Eine Bestätigung, keine Umfrage und kein Zusatzangebot. Der Eingang der Erklärung wird sofort dauerhaft bestätigt; Anbieterabgleich wird getrennt geführt.", "focus": "mitgliedschaft"}, {"key": "canceled", "label": "2 · Kündigung erfolgreich", "group": "Kündigung", "note": "Der ursprüngliche Testzeitraum und die Produktnutzung bleiben bis zum Ablauf erhalten. Eine erforderliche Bestätigung wird zugestellt.", "focus": "mitgliedschaft"}, {"key": "cancel-error", "label": "3 · Kündigung nicht bestätigt", "group": "Kündigung", "note": "Nur bei fehlgeschlagener Speicherung der Erklärung. Eine bereits eingegangene Kündigung bleibt wirksam, auch wenn der Anbieterabgleich noch läuft.", "focus": "mitgliedschaft"}, {"key": "cancel-received", "label": "3b · Kündigung eingegangen", "group": "Kündigung", "note": "Rechtlicher Eingang und technische Anbieterbestätigung sind getrennt. Ein Eingang vor der Frist wird honoriert; irrtümliche spätere Abbuchungen werden abgewickelt. Wiederaufnahme bleibt bis zum sicheren Abgleich gesperrt.", "focus": "mitgliedschaft"}, {"key": "restore-confirm", "label": "4 · Abo fortsetzen", "group": "Kündigung", "note": "PayPal-Beispiel. Bei Stripe entfällt dieser Hinweis, wenn keine erneute Anbieterfreigabe nötig ist. Kein Neustart der sieben Tage.", "focus": "mitgliedschaft"}, {"key": "restore-abandoned", "label": "5 · PayPal-Freigabe abgebrochen", "group": "Kündigung", "note": "Dieser Status erscheint nur bei bestätigtem Abbruch ohne aktive Ersatzvereinbarung. Unbekannter Status wird zunächst abgeglichen.", "focus": "mitgliedschaft"}, {"key": "switch-monthly", "label": "6 · Zum Monatsabo wechseln", "group": "Planwechsel", "note": "Kein Geld heute und keine zusätzlichen Testtage. Beim Monatsabo entfällt der Jahresrabatt. Stripe zeigt den PayPal-Hinweis nicht.", "focus": "mitgliedschaft"}, {"key": "switch-annual", "label": "7 · Zum Jahresabo wechseln", "group": "Planwechsel", "note": "Beispiel für ein noch verfügbares, bestätigtes Launch-Angebot. Tatsächlicher Betrag kommt aus dem serverseitigen Angebot; kein stiller Preiswechsel.", "focus": "mitgliedschaft"}, {"key": "switch-pending", "label": "8 · Wechsel wird abgeglichen", "group": "Planwechsel", "note": "Originale Testfrist bleibt bestehen. Erst nach bestätigtem Anbieterstatus werden der neue Plan und seine Zahlungstermine als aktiv gezeigt.", "focus": "mitgliedschaft"}, {"key": "switch-done", "label": "9 · Wechsel abgeschlossen", "group": "Planwechsel", "note": "Unverändertes Testende; neue bestätigte Zahlungsbedingungen.", "focus": "mitgliedschaft"}, {"key": "payment-failed", "label": "10 · Erste Zahlung fehlgeschlagen", "group": "Zahlung", "note": "Diese zahlbare Ansicht setzt voraus, dass keine alte Zahlung mehr aussteht oder noch eingezogen werden kann. Sonst erscheint zuerst die Prüfungsansicht. Keine persönliche Produktvorschau.", "focus": ""}, {"key": "payment-processing", "label": "11 · Zahlung wird geprüft", "group": "Zahlung", "note": "Nach Testende ohne bestätigte Zahlung kein Produktzugang. Kein zweiter Checkout, solange das Zahlungsergebnis unklar ist.", "focus": ""}, {"key": "payment-success", "label": "12 · Zahlung erfolgreich", "group": "Zahlung", "note": "Beispiel für erfolgreiche Zahlung drei Tage nach Testende: ein volles Jahr ab Zahlung. Bestehende Verwaltung nach dem bezahlten Start bleibt erhalten.", "focus": "mitgliedschaft"}, {"key": "return-expired", "label": "13 · Rückkehr nach Testende", "group": "Zahlung", "note": "Keine neue Testphase. Dieses Beispiel hat noch keinen bezahlten Launch-Jahresrabatt genutzt; andernfalls wird der zutreffende reguläre Preis gezeigt.", "focus": ""}, {"key": "public-cancel", "label": "14 · Kündigen ohne Login", "group": "Erforderliche Funktionen", "note": "Ständig erreichbarer Einstieg „Verträge hier kündigen“ im öffentlichen Footer. Zusätzlicher Weg zum Profil. Kein Login-/OTP-Zwang zum Übermitteln; keine Auskunft über Konten an Unbefugte. Sonderkündigung blendet ein Grundfeld ein; der Termin ist in der Umsetzung bearbeitbar.", "focus": ""}, {"key": "public-cancel-received", "label": "15 · Kündigungseingang", "group": "Erforderliche Funktionen", "note": "Beispiel einer zunächst ungeklärten Zuordnung. Die Erklärung samt Zeitstempel wird sofort bestätigt. Bei sicherer Zuordnung enthält die Bestätigung auch das konkrete Vertragsende. Ein Anbieterfehler macht die Erklärung nicht unwirksam.", "focus": ""}, {"key": "withdrawal", "label": "16 · Widerruf übermitteln", "group": "Erforderliche Funktionen", "note": "Eigenständiger gesetzlicher Widerruf, nicht mit ordentlicher Kündigung verwechselt. Einstieg während der Widerrufsfrist hervorgehoben und leicht erreichbar. Frist-/Leistungsbeginn und Abwicklung werden rechtlich geprüft; kein automatisches Erlöschen unterstellt.", "focus": ""}, {"key": "withdrawal-received", "label": "17 · Widerrufseingang", "group": "Erforderliche Funktionen", "note": "Dauerhafte Eingangsbestätigung mit Inhalt und Zeitstempel. Noch keine erfundene Rückerstattungszusage oder finale Entscheidung über die Anwendbarkeit des Widerrufsrechts.", "focus": ""}];const select=document.getElementById('state'),frame=document.querySelector('iframe');let index=0;for(const state of states){let g=[...select.children].find(g=>g.label===state.group);if(!g){g=document.createElement('optgroup');g.label=state.group;select.append(g)}const o=document.createElement('option');o.value=state.key;o.textContent=state.label;g.append(o)}function show(i){index=Math.max(0,Math.min(states.length-1,i));const s=states[index];select.value=s.key;frame.src='journey/'+s.key+'.html';document.getElementById('note').textContent=s.note;document.getElementById('count').textContent=(index+1)+' / '+states.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===states.length-1;history.replaceState(null,'','#'+s.key)}frame.onload=()=>{const s=states[index];if(s.focus){const el=frame.contentDocument.getElementById(s.focus);if(el)frame.contentWindow.scrollTo(0,el.offsetTop-100)}};select.onchange=()=>show(states.findIndex(s=>s.key===select.value));document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);for(const id of ['mobile','desktop'])document.getElementById(id).onclick=()=>{document.getElementById('preview').classList.toggle('desktop',id==='desktop');for(const key of ['mobile','desktop'])document.getElementById(key).setAttribute('aria-pressed',String(key===id))};show(Math.max(0,states.findIndex(s=>s.key===location.hash.slice(1))));</script></body></html>
