<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stage 3 – Statusausdruck ohne Passt-Text</title>
    <style>
      :root {
        --ink: #302834;
        --muted: #716b70;
        --plum: #5b3587;
        --line: #e3dce6;
        --paper: #fffdfa;
        --green: #347a54;
        --red: #9a4b53;
        --amber: #8a641c;
        --target: #f7f3fa;
        --coral: #dc606c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #262626;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      tr:focus-visible {
        outline: 3px solid #d9aff6;
        outline-offset: 2px;
      }
      .lab {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        padding: 12px 16px;
        color: #fff;
        background: #191919;
        border-bottom: 1px solid #555;
      }
      .lab strong {
        margin-right: 4px;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .lab button {
        min-height: 38px;
        padding: 7px 10px;
        color: #fff;
        background: #303030;
        border: 1px solid #747474;
        border-radius: 8px;
      }
      .lab button[aria-pressed="true"] {
        background: #754ca4;
        border-color: #c5a4eb;
      }
      .note {
        width: min(1040px, calc(100% - 30px));
        margin: 14px auto 0;
        padding: 11px 14px;
        color: #f4edf8;
        background: #3d3446;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
      }
      .note b {
        color: #fff;
      }
      .canvas {
        display: grid;
        place-items: center;
        padding: 18px 20px 48px;
      }
      .journey {
        display: flex;
        flex-direction: column;
        width: min(400px, 100vw);
        height: 822px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 24px 55px #0008;
      }
      .journey.desktop {
        width: min(900px, calc(100vw - 40px));
        height: 850px;
      }
      header {
        flex: 0 0 auto;
        padding: 14px 18px 12px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .brand-row,
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        color: #432260;
        font:
          700 30px/1 Georgia,
          serif;
      }
      .saved {
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 12px;
        color: #777;
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }
      .step:before {
        content: "";
        display: block;
        height: 6px;
        margin-bottom: 5px;
        background: #e4e0e5;
        border-radius: 8px;
      }
      .step.done:before {
        background: #7651a5;
      }
      .step.active {
        color: #342047;
      }
      .step.active:before {
        background: #442463;
      }
      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 17px 18px 26px;
      }
      .desktop .content {
        width: 100%;
        max-width: 820px;
        margin: auto;
        padding: 22px 32px 34px;
      }
      .topline {
        color: var(--muted);
        font-size: 13px;
      }
      .back {
        padding: 4px;
        color: var(--ink);
        background: transparent;
        border: 0;
        font-size: 23px;
      }
      .context {
        margin: 15px 0 4px;
        color: var(--plum);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          700 27px/1.1 Georgia,
          serif;
        letter-spacing: -0.025em;
      }
      .overall {
        margin: 8px 0 12px;
      }
      .overall strong {
        color: var(--amber);
        font-size: 12px;
      }
      .overall span {
        margin-left: 5px;
        color: var(--muted);
        font-size: 10px;
      }
      .products {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .product {
        min-width: 0;
        padding: 9px 8px;
        background: #fff;
        border: 1px solid #b99dce;
        border-radius: 13px;
      }
      .product.alt {
        background: #fcfffd;
        border-color: #8bb69b;
      }
      .product small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }
      .product.alt small {
        color: var(--green);
      }
      .product b {
        display: block;
        margin-top: 4px;
        overflow-wrap: anywhere;
        font-size: 11px;
        line-height: 1.22;
      }
      .matrix {
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .matrix-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 850;
      }
      .matrix-head span:last-child {
        color: var(--muted);
        font-size: 10px;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
        text-align: center;
        vertical-align: middle;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 850;
      }
      th:first-child,
      td:first-child {
        width: 34%;
        padding-left: 10px;
        text-align: left;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tr {
        cursor: pointer;
      }
      tr[aria-selected="true"] td:first-child {
        box-shadow: inset 3px 0 0 var(--plum);
      }
      tr.negative td {
        background: #fffafa;
      }
      tr.positive td {
        background: #fbfdfb;
      }
      tr.negative td:first-child {
        border-left: 2px solid #c78e94;
      }
      tr.positive td:first-child {
        border-left: 2px solid #8fb49d;
      }
      .target {
        color: #442c58 !important;
        background: var(--target) !important;
      }
      .alternative {
        color: #246342 !important;
        background: #f5faf6 !important;
      }
      .symbol {
        display: block;
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 900;
      }
      .metric {
        display: grid;
        gap: 4px;
        min-width: 0;
      }
      .metric-line {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: space-between;
      }
      .micro {
        display: inline-flex;
        gap: 3px;
        align-items: center;
        width: max-content;
        max-width: 100%;
        font-size: 8px;
        font-weight: 800;
        line-height: 1.1;
      }
      .micro.good {
        color: var(--green);
      }
      .micro.bad {
        color: var(--red);
      }
      .ring {
        display: grid;
        place-items: center;
        width: 14px;
        height: 14px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 8px;
        font-weight: 900;
      }
      .relation {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 850;
      }
      .current-status {
        display: grid;
        gap: 2px;
      }
      .current-status .ring {
        margin: auto;
      }
      .selected {
        min-height: 112px;
        margin-top: 10px;
        padding: 12px 13px;
        background: #fff;
        border: 1px solid #cbb7dc;
        border-radius: 14px;
      }
      .selected .eyebrow {
        color: var(--plum);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .selected h2 {
        margin: 4px 0 5px;
        font-size: 15px;
      }
      .selected p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .selected strong {
        color: var(--ink);
      }
      .basis {
        display: inline-flex;
        margin-top: 6px;
        padding: 3px 6px;
        color: #43265d;
        background: #f3eef9;
        border-radius: 5px;
        font-size: 9px;
        font-weight: 750;
      }
      .footer {
        flex: 0 0 auto;
        padding: 11px 18px 15px;
        background: #fffdfaea;
        border-top: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .cta {
        width: 100%;
        min-height: 53px;
        padding: 11px 15px;
        color: #fff;
        background: var(--coral);
        border: 0;
        border-radius: 27px;
        font-weight: 850;
      }
      .v1 .micro {
        margin-top: 1px;
      }
      .v2 .micro {
        letter-spacing: 0.015em;
      }
      .v3 .micro {
        padding-top: 2px;
        border-top: 1px solid currentColor;
      }
      .v4 td:first-child .micro {
        display: none;
      }
      .v5 .micro {
        font-size: 0;
      }
      .v5 .micro:before {
        content: attr(data-short);
        font-size: 8px;
      }
      .desktop table th,
      .desktop table td {
        padding: 11px 7px;
        font-size: 12px;
      }
      .desktop .products,
      .desktop .matrix,
      .desktop .selected {
        max-width: 720px;
      }
      .desktop .footer {
        padding-inline: max(18px, calc((100% - 756px) / 2));
      }
      @media (max-width: 420px) {
        .canvas {
          padding-inline: 0;
        }
        .note {
          width: calc(100% - 20px);
        }
      }
    </style>
  </head>
  <body>
    <nav class="lab">
      <strong>Status ohne „passt“</strong>
      <div class="group" id="variants"></div>
      <div class="group">
        <button data-view="mobile" aria-pressed="true">Mobil</button
        ><button data-view="desktop" aria-pressed="false">Desktop</button>
      </div>
    </nav>
    <aside class="note" id="note"></aside>
    <div class="canvas">
      <main class="journey" id="journey">
        <header>
          <div class="brand-row">
            <span class="brand">chaarlie</span><span class="saved">Gespeichert</span>
          </div>
          <div class="steps">
            <span class="step done">Bedarf</span><span class="step done">Verfeinerung</span
            ><span class="step active">Produkte</span><span class="step">Routine</span
            ><span class="step">Anwendung</span>
          </div>
        </header>
        <section class="content" id="content"></section>
        <footer class="footer"><button class="cta">Mein Produkt behalten</button></footer>
      </main>
    </div>
    <script>
      const rows = [
        {
          id: "weight",
          name: "Pflegegewicht",
          own: "mittel",
          target: "mittel",
          alt: "mittel",
          match: true,
          why: "Mittlere Pflege gibt deinem Haar genug Geschmeidigkeit, ohne es unnötig zu beschweren.",
          basis: "braucht Pflege, wird aber schnell beschwert",
        },
        {
          id: "focus",
          name: "Pflegefokus",
          own: "Protein",
          target: "ausgewogen",
          alt: "ausgewogen",
          match: false,
          why: "Ein ausgewogener Fokus verbindet Feuchtigkeit und Strukturpflege. Eine starke Proteinrichtung ist für deinen aktuellen Bedarf nicht nötig.",
          basis: "mehr Geschmeidigkeit, keine starke Strukturbelastung",
        },
        {
          id: "repair",
          name: "Repair-Unterstützung",
          own: "mittel",
          target: "mittel",
          alt: "mittel",
          match: true,
          why: "Mittlere Repair-Unterstützung reicht für deine derzeitige Belastung aus. Mehr Repair würde keinen zusätzlichen bestätigten Bedarf abdecken.",
          basis: "geringe bis mittlere aktuelle Belastung",
        },
      ]
      const options = [
        {
          id: 1,
          label: "Nur Zeichen",
          title: "Nur ein kleines Konturzeichen",
          note: "Check oder Kreuz neben dem Namen; die Zeilenfarbe und der Wertvergleich liefern den übrigen Kontext. Visuell am ruhigsten.",
        },
        {
          id: 2,
          label: "Im Ziel",
          title: "„Im Ziel“ oder „außerhalb“",
          note: "Der Text beschreibt die Beziehung zum Ziel statt ein allgemeines Produkturteil.",
        },
        {
          id: 3,
          label: "= Ziel",
          title: "„= Ziel“ oder „≠ Ziel“",
          note: "Die Statuszeile wird zur direkten Beziehung zwischen aktuellem Wert und Ziel. Präzise, knapp und eng mit der Matrixlogik verbunden.",
        },
        {
          id: 4,
          label: "Am Wert",
          title: "Status direkt beim aktuellen Wert",
          note: "Der Metrikname bleibt völlig sauber; Check oder Kreuz steht dort, wo die Abweichung tatsächlich sichtbar wird: in der Spalte „Deins“.",
        },
        {
          id: 5,
          label: "Ziel ✓/×",
          title: "Kompaktes Zielzeichen am Namen",
          note: "Ein kurzes „Ziel ✓“ oder „Ziel ×“ sitzt rechts neben dem Metriknamen. Kein zweiter Textblock unter dem Namen.",
        },
      ]
      let variant = 4,
        selected = "focus"
      const variants = document.getElementById("variants"),
        content = document.getElementById("content"),
        note = document.getElementById("note"),
        journey = document.getElementById("journey")
      function expression(d) {
        const cls = d.match ? "good" : "bad",
          sign = d.match ? "✓" : "×"
        if (variant === 1)
          return `<span class="micro ${cls}" aria-label="${d.match ? "Im Ziel" : "Außerhalb des Ziels"}"><i class="ring">${sign}</i></span>`
        if (variant === 2)
          return `<span class="micro ${cls}"><i class="ring">${sign}</i>${d.match ? "im Ziel" : "außerhalb"}</span>`
        if (variant === 3)
          return `<span class="micro relation ${cls}">${d.match ? "= Ziel" : "≠ Ziel"}</span>`
        if (variant === 5)
          return `<span class="micro ${cls}" data-short="Ziel ${sign}" aria-label="${d.match ? "Ziel erreicht" : "Ziel nicht erreicht"}"></span>`
        return ""
      }
      function current(d) {
        if (variant !== 4) return d.own
        return `<span class="current-status">${d.own}<i class="ring ${d.match ? "micro good" : "micro bad"}" aria-label="${d.match ? "Im Ziel" : "Außerhalb des Ziels"}">${d.match ? "✓" : "×"}</i></span>`
      }
      function tableRows() {
        return rows
          .map(
            (d) =>
              `<tr class="${d.match ? "positive" : "negative"}" tabindex="0" aria-selected="${selected === d.id}" data-select="${d.id}"><td><div class="metric"><div class="metric-line"><b>${d.name}</b>${variant === 5 ? expression(d) : ""}</div>${variant === 5 ? "" : expression(d)}</div></td><td>${current(d)}</td><td class="target"><span class="symbol">▣</span>${d.target}</td><td class="alternative"><span class="symbol">✓</span>${d.alt}</td></tr>`,
          )
          .join("")
      }
      function panel() {
        const d = rows.find((x) => x.id === selected) || rows[0]
        return `<section class="selected"><span class="eyebrow">Ausgewählter Prüfpunkt · ${d.match ? "im Ziel" : "außerhalb des Ziels"}</span><h2>${d.name}</h2><p><strong>Warum ${d.target}?</strong> ${d.why}</p><span class="basis">Aus deinem Profil: ${d.basis}</span></section>`
      }
      function bind() {
        document.querySelectorAll("[data-select]").forEach((el) => {
          const choose = () => {
            selected = el.dataset.select
            render()
          }
          el.addEventListener("click", choose)
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault()
              choose()
            }
          })
        })
      }
      function render() {
        const o = options.find((x) => x.id === variant)
        content.innerHTML = `<div class="topline"><button class="back" aria-label="Zurück">←</button><span>Produkte prüfen</span></div><p class="context">Conditioner · 2 von 5</p><h1>Dein Conditioner im Vergleich</h1><div class="overall"><strong>Passt teilweise</strong><span>2 von 3 im Ziel</span></div><div class="products"><article class="product"><small>Dein Produkt</small><b>Jean&amp;Len Conditioner Keratin/Mandel</b></article><article class="product alt"><small>Passende Alternative</small><b>Sante Intense Hydration Conditioner</b></article></div><section class="matrix v${variant}"><div class="matrix-head"><span>Eigenschaft für Eigenschaft</span><span>Zeile antippen</span></div><table><thead><tr><th>Prüfpunkt</th><th>Deins</th><th>Ziel</th><th>Alternative</th></tr></thead><tbody>${tableRows()}</tbody></table></section>${panel()}`
        note.innerHTML = `<b>Variante ${o.id}: ${o.title}.</b> ${o.note} Die gewählte leise Status-Zeile und das Auswahl-Panel bleiben unverändert.`
        document
          .querySelectorAll("[data-variant]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(Number(b.dataset.variant) === variant)),
          )
        content.scrollTop = 0
        bind()
      }
      options.forEach((o) => {
        const b = document.createElement("button")
        b.dataset.variant = o.id
        b.textContent = `${o.id}. ${o.label}`
        b.setAttribute("aria-pressed", String(o.id === variant))
        b.addEventListener("click", () => {
          variant = o.id
          render()
        })
        variants.appendChild(b)
      })
      document.querySelectorAll("[data-view]").forEach((b) =>
        b.addEventListener("click", () => {
          journey.classList.toggle("desktop", b.dataset.view === "desktop")
          document
            .querySelectorAll("[data-view]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)))
        }),
      )
      render()
    </script>
  </body>
</html>
