<div id="chaarlie-product-examples">
  <style>
    #chaarlie-product-examples {
      color: #301d49;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0 auto;
      max-width: 900px;
    }
    #chaarlie-product-examples * { box-sizing: border-box; }
    #chaarlie-product-examples .sheet {
      background: #fbfaf9;
      border: 1px solid #e5dfe8;
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(56, 34, 79, .11);
      overflow: hidden;
    }
    #chaarlie-product-examples header {
      align-items: flex-end;
      background: #fff;
      border-bottom: 1px solid #ebe5ed;
      display: flex;
      gap: 20px;
      justify-content: space-between;
      padding: 24px 28px 20px;
    }
    #chaarlie-product-examples h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      margin: 0;
    }
    #chaarlie-product-examples .note {
      color: #6e6672;
      font-size: 12px;
      max-width: 285px;
      text-align: right;
    }
    #chaarlie-product-examples .shelves {
      background: #e9e3ed;
      display: grid;
      gap: 28px;
      padding: 30px 24px 38px;
    }
    #chaarlie-product-examples .shelf {
      display: grid;
      gap: 4px;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      padding-bottom: 19px;
      position: relative;
    }
    #chaarlie-product-examples .shelf::after {
      background: #cba989;
      border-radius: 8px;
      bottom: 0;
      box-shadow: 0 8px 13px rgba(62, 42, 72, .16);
      content: "";
      height: 8px;
      left: 0;
      position: absolute;
      right: 0;
    }
    #chaarlie-product-examples figure {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin: 0;
      min-width: 0;
    }
    #chaarlie-product-examples svg {
      height: 148px;
      max-width: 132px;
      overflow: visible;
      width: 100%;
    }
    #chaarlie-product-examples .fill { fill: #f3f0e8; }
    #chaarlie-product-examples .stroke {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }
    #chaarlie-product-examples image.external { mix-blend-mode: multiply; }
    #chaarlie-product-examples figcaption {
      color: #493555;
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
      min-height: 28px;
      text-align: center;
    }
    #chaarlie-product-examples .shampoo { color: #d0a43c; }
    #chaarlie-product-examples .conditioner { color: #67abc4; }
    #chaarlie-product-examples .leavein { color: #68ad88; }
    #chaarlie-product-examples .heat { color: #d98271; }
    #chaarlie-product-examples .oil { color: #bc914e; }
    #chaarlie-product-examples .mask { color: #b47fbd; }
    #chaarlie-product-examples .scalp { color: #788fc1; }
    #chaarlie-product-examples .dry { color: #78a8a2; }
    #chaarlie-product-examples .bond { color: #987bc3; }
    #chaarlie-product-examples .deep { color: #708da2; }
    @media (max-width: 650px) {
      #chaarlie-product-examples .sheet { border-radius: 16px; }
      #chaarlie-product-examples header { align-items: flex-start; flex-direction: column; padding: 20px 18px 16px; }
      #chaarlie-product-examples h1 { font-size: 27px; }
      #chaarlie-product-examples .note { text-align: left; }
      #chaarlie-product-examples .shelves { gap: 20px; padding: 24px 12px 30px; }
      #chaarlie-product-examples .shelf { gap: 14px 5px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #chaarlie-product-examples svg { height: 138px; }
    }
  </style>
