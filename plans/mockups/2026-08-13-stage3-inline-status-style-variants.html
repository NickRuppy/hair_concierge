<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stage 3 – leise Statusvarianten</title>
    <style>
      :root {
        --ink: #302834;
        --muted: #716b70;
        --plum: #5b3587;
        --line: #e3dce6;
        --paper: #fffdfa;
        --green: #347a54;
        --green-wash: #f2f8f4;
        --red: #9a4b53;
        --red-wash: #fcf4f5;
        --amber: #8a641c;
        --target: #f4eef9;
        --coral: #dc606c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #262626;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      tr[tabindex]:focus-visible {
        outline: 3px solid #d9aff6;
        outline-offset: 2px;
      }
      .lab {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        padding: 12px 16px;
        color: #fff;
        background: #191919;
        border-bottom: 1px solid #555;
      }
      .lab strong {
        margin-right: 4px;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .lab button {
        min-height: 38px;
        padding: 7px 10px;
        color: #fff;
        background: #303030;
        border: 1px solid #747474;
        border-radius: 8px;
      }
      .lab button[aria-pressed="true"] {
        background: #754ca4;
        border-color: #c5a4eb;
      }
      .note {
        width: min(1040px, calc(100% - 30px));
        margin: 14px auto 0;
        padding: 11px 14px;
        color: #f4edf8;
        background: #3d3446;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
      }
      .note b {
        color: #fff;
      }
      .canvas {
        display: grid;
        place-items: center;
        padding: 18px 20px 48px;
      }
      .journey {
        display: flex;
        flex-direction: column;
        width: min(400px, 100vw);
        height: 822px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 24px 55px #0008;
      }
      .journey.desktop {
        width: min(900px, calc(100vw - 40px));
        height: 850px;
      }
      header {
        flex: 0 0 auto;
        padding: 14px 18px 12px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .brand-row,
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        color: #432260;
        font:
          700 30px/1 Georgia,
          serif;
      }
      .saved {
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 12px;
        color: #777;
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }
      .step:before {
        content: "";
        display: block;
        height: 6px;
        margin-bottom: 5px;
        background: #e4e0e5;
        border-radius: 8px;
      }
      .step.done:before {
        background: #7651a5;
      }
      .step.active {
        color: #342047;
      }
      .step.active:before {
        background: #442463;
      }
      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 17px 18px 26px;
      }
      .desktop .content {
        width: 100%;
        max-width: 820px;
        margin: auto;
        padding: 22px 32px 34px;
      }
      .topline {
        color: var(--muted);
        font-size: 13px;
      }
      .back {
        padding: 4px;
        color: var(--ink);
        background: transparent;
        border: 0;
        font-size: 23px;
      }
      .context {
        margin: 15px 0 4px;
        color: var(--plum);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          700 27px/1.1 Georgia,
          serif;
        letter-spacing: -0.025em;
      }
      .desktop h1 {
        font-size: 34px;
      }
      .overall {
        margin: 8px 0 12px;
      }
      .overall strong {
        font-size: 12px;
      }
      .overall.bad strong {
        color: var(--red);
      }
      .overall.partial strong {
        color: var(--amber);
      }
      .overall.good strong {
        color: var(--green);
      }
      .overall span {
        margin-left: 5px;
        color: var(--muted);
        font-size: 10px;
      }
      .products {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .products.single {
        grid-template-columns: 1fr;
      }
      .product {
        min-width: 0;
        padding: 9px 8px;
        background: #fff;
        border: 1px solid #b99dce;
        border-radius: 13px;
      }
      .product.alt {
        background: #fcfffd;
        border-color: #8bb69b;
      }
      .product small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }
      .product.alt small {
        color: var(--green);
      }
      .product b {
        display: block;
        margin-top: 4px;
        overflow-wrap: anywhere;
        font-size: 11px;
        line-height: 1.22;
      }
      .matrix {
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .matrix-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 850;
      }
      .matrix-head span:last-child {
        color: var(--muted);
        font-size: 10px;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
        text-align: center;
        vertical-align: middle;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 850;
      }
      th:first-child,
      td:first-child {
        width: 34%;
        padding-left: 10px;
        text-align: left;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tr[tabindex] {
        cursor: pointer;
      }
      tr[aria-selected="true"] td:first-child {
        box-shadow: inset 3px 0 0 var(--plum);
      }
      .target {
        color: #442c58;
        background: var(--target);
      }
      .alternative {
        color: #246342;
        background: #f0f8f3;
      }
      .symbol {
        display: block;
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 900;
      }
      .selected {
        min-height: 112px;
        margin-top: 10px;
        padding: 12px 13px;
        background: #fff;
        border: 1px solid #cbb7dc;
        border-radius: 14px;
      }
      .selected .eyebrow {
        color: var(--plum);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .selected h2 {
        margin: 4px 0 5px;
        font-size: 15px;
      }
      .selected p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .selected strong {
        color: var(--ink);
      }
      .basis {
        display: inline-flex;
        margin-top: 6px;
        padding: 3px 6px;
        color: #43265d;
        background: #f3eef9;
        border-radius: 5px;
        font-size: 9px;
        font-weight: 750;
      }
      .footer {
        flex: 0 0 auto;
        padding: 11px 18px 15px;
        background: #fffdfaea;
        border-top: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .cta {
        width: 100%;
        min-height: 53px;
        padding: 11px 15px;
        color: #fff;
        background: var(--coral);
        border: 0;
        border-radius: 27px;
        font-weight: 850;
      }
      .metric {
        display: grid;
        gap: 4px;
      }
      .metric b {
        line-height: 1.15;
      }
      .status {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        width: max-content;
        max-width: 100%;
        color: var(--muted);
        font-size: 8px;
        font-weight: 800;
        line-height: 1.1;
      }
      .status.bad {
        color: var(--red);
      }
      .status.good {
        color: var(--green);
      }
      .v1 .status-mark {
        font-size: 10px;
        font-weight: 900;
      }
      .v2 .status {
        position: relative;
        padding-left: 17px;
      }
      .v2 .status:before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 12px;
        height: 2px;
        background: currentColor;
        border-radius: 2px;
      }
      .outline-mark {
        display: grid;
        place-items: center;
        width: 15px;
        height: 15px;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 8px;
        font-weight: 900;
      }
      .v4 .status {
        gap: 3px;
        letter-spacing: 0.025em;
      }
      .v4 .status-mark {
        font:
          700 12px/1 Georgia,
          serif;
      }
      .v5 .status {
        padding-top: 3px;
        border-top: 1px solid currentColor;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }
      .v5 .status-mark {
        display: none;
      }
      .v6 tr.row-bad td {
        background: #fffafa;
      }
      .v6 tr.row-good td {
        background: #fbfdfb;
      }
      .v6 tr.row-bad td:first-child {
        border-left: 2px solid #c78e94;
      }
      .v6 tr.row-good td:first-child {
        border-left: 2px solid #8fb49d;
      }
      .v6 .target {
        background: #f7f3fa !important;
      }
      .v6 .alternative {
        background: #f5faf6 !important;
      }
      .v6 .status {
        font-size: 8px;
        font-weight: 750;
      }
      .v6 .outline-mark {
        width: 13px;
        height: 13px;
        border-color: #aaa;
        color: inherit;
        background: transparent;
        font-size: 7px;
      }
      .desktop table th,
      .desktop table td {
        padding: 11px 7px;
        font-size: 12px;
      }
      .desktop .products,
      .desktop .matrix,
      .desktop .selected {
        max-width: 720px;
      }
      .desktop .footer {
        padding-inline: max(18px, calc((100% - 756px) / 2));
      }
      @media (max-width: 420px) {
        .canvas {
          padding-inline: 0;
        }
        .note {
          width: calc(100% - 20px);
        }
      }
    </style>
  </head>
  <body>
    <nav class="lab">
      <strong>Ohne Pill</strong>
      <div class="group" id="variants"></div>
      <div class="group">
        <button data-case="bad" aria-pressed="false">Passt nicht</button
        ><button data-case="partial" aria-pressed="true">Teilweise</button
        ><button data-case="good" aria-pressed="false">Passt</button>
      </div>
      <div class="group">
        <button data-view="mobile" aria-pressed="true">Mobil</button
        ><button data-view="desktop" aria-pressed="false">Desktop</button>
      </div>
    </nav>
    <aside class="note" id="note"></aside>
    <div class="canvas">
      <main class="journey" id="journey" aria-live="polite">
        <header>
          <div class="brand-row">
            <span class="brand">chaarlie</span><span class="saved">Gespeichert</span>
          </div>
          <div class="steps">
            <span class="step done">Bedarf</span><span class="step done">Verfeinerung</span
            ><span class="step active">Produkte</span><span class="step">Routine</span
            ><span class="step">Anwendung</span>
          </div>
        </header>
        <section class="content" id="content"></section>
        <footer class="footer"><button class="cta" id="cta">Mein Produkt behalten</button></footer>
      </main>
    </div>
    <script>
      const defs = [
        {
          id: "weight",
          name: "Pflegegewicht",
          target: "mittel",
          alt: "mittel",
          bad: "leicht",
          good: "mittel",
          why: "Mittlere Pflege gibt deinem Haar genug Geschmeidigkeit, ohne es unnötig zu beschweren.",
          basis: "braucht Pflege, wird aber schnell beschwert",
        },
        {
          id: "focus",
          name: "Pflegefokus",
          target: "ausgewogen",
          alt: "ausgewogen",
          bad: "Protein",
          good: "ausgewogen",
          why: "Ein ausgewogener Fokus verbindet Feuchtigkeit und Strukturpflege. Eine starke Proteinrichtung ist für deinen aktuellen Bedarf nicht nötig.",
          basis: "mehr Geschmeidigkeit, keine starke Strukturbelastung",
        },
        {
          id: "repair",
          name: "Repair-Unterstützung",
          target: "mittel",
          alt: "mittel",
          bad: "hoch",
          good: "mittel",
          why: "Mittlere Repair-Unterstützung reicht für deine derzeitige Belastung aus. Mehr Repair würde keinen zusätzlichen bestätigten Bedarf abdecken.",
          basis: "geringe bis mittlere aktuelle Belastung",
        },
      ]
      const cases = {
        bad: {
          matches: [false, false, false],
          verdict: "Passt nicht",
          detail: "0 von 3 im Ziel",
          cta: "Diese Alternative wählen",
        },
        partial: {
          matches: [true, false, true],
          verdict: "Passt teilweise",
          detail: "2 von 3 im Ziel",
          cta: "Mein Produkt behalten",
        },
        good: {
          matches: [true, true, true],
          verdict: "Passt",
          detail: "3 von 3 im Ziel",
          cta: "Mein Produkt behalten",
        },
      }
      const options = [
        {
          id: 1,
          label: "Klartext",
          title: "Symbol und Klartext ohne Container",
          note: "Die direkteste Pill-Alternative: ein kleines Zeichen plus „Passt“ oder „Passt nicht“, ohne Fläche oder Rahmen.",
        },
        {
          id: 2,
          label: "Haarlinie",
          title: "Kurze Statuslinie vor dem Wort",
          note: "Eine zwei Pixel dünne Linie trägt die Farbe; das Wort bleibt der wichtigste Bedeutungsträger.",
        },
        {
          id: 3,
          label: "Kontur",
          title: "Kleines Kontursymbol",
          note: "Check oder Kreuz sitzt in einem sehr kleinen, ungefüllten Kreis. Deutlich, aber viel ruhiger als das große Status-Zeilen-Symbol.",
        },
        {
          id: 4,
          label: "Typografisch",
          title: "Typografisches Zeichen",
          note: "Ein kleines Serif-Zeichen und Klartext wirken redaktioneller und weniger wie ein Systemstatus.",
        },
        {
          id: 5,
          label: "Editorial",
          title: "Schmale Editorial-Unterzeile",
          note: "Eine feine Linie plus Status in kleinen Versalien trennt Name und Urteil, ohne einen Badge zu erzeugen.",
        },
        {
          id: 6,
          label: "Status-Zeile leise",
          title: "Status-Zeile mit reduzierter Lautstärke",
          note: "Nur zwei Pixel Rand, fast weiße Flächen und ein 13-Pixel-Kontursymbol. Die Zeile bleibt als Ganzes lesbar, ohne wie ein Fehlerblock zu wirken.",
        },
      ]
      let variant = 1,
        currentCase = "partial",
        selected = "focus"
      const variants = document.getElementById("variants"),
        content = document.getElementById("content"),
        note = document.getElementById("note"),
        journey = document.getElementById("journey"),
        cta = document.getElementById("cta")
      function data() {
        return defs.map((d, i) => ({
          ...d,
          match: cases[currentCase].matches[i],
          own: cases[currentCase].matches[i] ? d.good : d.bad,
        }))
      }
      function status(d) {
        const word = d.match ? "Passt" : "Passt nicht",
          sign = d.match ? "✓" : "×"
        if (variant === 3 || variant === 6)
          return `<span class="status ${d.match ? "good" : "bad"}"><i class="outline-mark">${sign}</i>${word}</span>`
        return `<span class="status ${d.match ? "good" : "bad"}"><i class="status-mark">${sign}</i>${word}</span>`
      }
      function overall() {
        const c = cases[currentCase],
          cls = currentCase === "good" ? "good" : currentCase === "bad" ? "bad" : "partial"
        return `<div class="overall ${cls}"><strong>${c.verdict}</strong><span>${c.detail}</span></div>`
      }
      function products() {
        const single = currentCase === "good"
        return `<div class="products ${single ? "single" : ""}"><article class="product"><small>Dein Produkt</small><b>Jean&amp;Len Conditioner Keratin/Mandel</b></article>${single ? "" : `<article class="product alt"><small>Passende Alternative</small><b>Sante Intense Hydration Conditioner</b></article>`}</div>`
      }
      function rows() {
        return data()
          .map(
            (d) =>
              `<tr class="row-${d.match ? "good" : "bad"}" tabindex="0" aria-selected="${selected === d.id}" data-select="${d.id}"><td><div class="metric"><b>${d.name}</b>${status(d)}</div></td><td>${d.own}</td><td class="target"><span class="symbol">▣</span>${d.target}</td><td class="alternative"><span class="symbol">✓</span>${d.alt}</td></tr>`,
          )
          .join("")
      }
      function panel() {
        const d = data().find((x) => x.id === selected) || data()[0]
        return `<section class="selected"><span class="eyebrow">Ausgewählter Prüfpunkt · ${d.match ? "Passt" : "Passt nicht"}</span><h2>${d.name}</h2><p><strong>Warum ${d.target}?</strong> ${d.why}</p><span class="basis">Aus deinem Profil: ${d.basis}</span></section>`
      }
      function bind() {
        document.querySelectorAll("[data-select]").forEach((el) => {
          const choose = () => {
            selected = el.dataset.select
            render()
          }
          el.addEventListener("click", choose)
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault()
              choose()
            }
          })
        })
      }
      function render() {
        const o = options.find((x) => x.id === variant)
        content.innerHTML = `<div class="topline"><button class="back" aria-label="Zurück">←</button><span>Produkte prüfen</span></div><p class="context">Conditioner · 2 von 5</p><h1>Dein Conditioner im Vergleich</h1>${overall()}${products()}<section class="matrix v${variant}"><div class="matrix-head"><span>Eigenschaft für Eigenschaft</span><span>Zeile antippen</span></div><table><thead><tr><th>Prüfpunkt</th><th>Deins</th><th>Ziel</th><th>Alternative</th></tr></thead><tbody>${rows()}</tbody></table></section>${panel()}`
        cta.textContent = cases[currentCase].cta
        note.innerHTML = `<b>Variante ${o.id}: ${o.title}.</b> ${o.note} Matrix, Gesamturteil und Auswahl-Panel bleiben gleich.`
        document
          .querySelectorAll("[data-variant]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(Number(b.dataset.variant) === variant)),
          )
        document
          .querySelectorAll("[data-case]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.case === currentCase)))
        content.scrollTop = 0
        bind()
      }
      options.forEach((o) => {
        const b = document.createElement("button")
        b.dataset.variant = o.id
        b.textContent = `${o.id}. ${o.label}`
        b.setAttribute("aria-pressed", String(o.id === variant))
        b.addEventListener("click", () => {
          variant = o.id
          render()
        })
        variants.appendChild(b)
      })
      document.querySelectorAll("[data-case]").forEach((b) =>
        b.addEventListener("click", () => {
          currentCase = b.dataset.case
          selected = currentCase === "partial" ? "focus" : "weight"
          render()
        }),
      )
      document.querySelectorAll("[data-view]").forEach((b) =>
        b.addEventListener("click", () => {
          journey.classList.toggle("desktop", b.dataset.view === "desktop")
          document
            .querySelectorAll("[data-view]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)))
        }),
      )
      render()
    </script>
  </body>
</html>
