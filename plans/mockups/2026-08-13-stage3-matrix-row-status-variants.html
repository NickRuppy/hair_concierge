<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 3 – Matrixzeilen mit eindeutigem Ergebnis</title>
    <style>
      :root {
        --ink: #302834;
        --muted: #716b70;
        --plum: #5b3587;
        --plum-dark: #3d2259;
        --line: #e3dce6;
        --paper: #fffdfa;
        --green: #287149;
        --green-bg: #e9f5ed;
        --red: #983d47;
        --red-bg: #fbebed;
        --amber: #8a5b13;
        --amber-bg: #fff5dd;
        --target: #f4eef9;
        --coral: #dc606c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: #262626;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      tr[tabindex]:focus-visible {
        outline: 3px solid #d9aff6;
        outline-offset: 2px;
      }
      .lab {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        align-items: center;
        padding: 12px 16px;
        color: #fff;
        background: #191919;
        border-bottom: 1px solid #555;
      }
      .lab strong {
        margin-right: 5px;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .lab button {
        min-height: 38px;
        padding: 7px 10px;
        color: #fff;
        background: #303030;
        border: 1px solid #747474;
        border-radius: 8px;
      }
      .lab button[aria-pressed="true"] {
        background: #754ca4;
        border-color: #c5a4eb;
      }
      .study-note {
        width: min(1040px, calc(100% - 30px));
        margin: 14px auto 0;
        padding: 11px 14px;
        color: #f4edf8;
        background: #3d3446;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.4;
      }
      .study-note b {
        color: #fff;
      }
      .canvas {
        display: grid;
        place-items: center;
        padding: 18px 20px 48px;
      }
      .journey {
        display: flex;
        flex-direction: column;
        width: min(400px, 100vw);
        height: 822px;
        overflow: hidden;
        background: var(--paper);
        box-shadow: 0 24px 55px #0008;
      }
      .journey.desktop {
        width: min(900px, calc(100vw - 40px));
        height: 850px;
      }
      header {
        flex: 0 0 auto;
        padding: 14px 18px 12px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        color: #432260;
        font:
          700 30px/1 Georgia,
          serif;
      }
      .saved {
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 12px;
        color: #777;
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }
      .step::before {
        content: "";
        display: block;
        height: 6px;
        margin-bottom: 5px;
        background: #e4e0e5;
        border-radius: 8px;
      }
      .step.done::before {
        background: #7651a5;
      }
      .step.active {
        color: #342047;
      }
      .step.active::before {
        background: #442463;
      }
      .content {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 17px 18px 26px;
      }
      .desktop .content {
        width: 100%;
        max-width: 820px;
        margin: auto;
        padding: 22px 32px 34px;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
      }
      .back {
        padding: 4px;
        color: var(--ink);
        background: transparent;
        border: 0;
        font-size: 23px;
      }
      .context {
        margin: 15px 0 4px;
        color: var(--plum);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          700 27px/1.1 Georgia,
          serif;
        letter-spacing: -0.025em;
      }
      .desktop h1 {
        font-size: 34px;
      }
      .overall {
        margin: 9px 0 12px;
      }
      .overall-title {
        font-size: 13px;
        font-weight: 850;
      }
      .overall-copy {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.35;
      }
      .overall.bad .overall-title {
        color: var(--red);
      }
      .overall.partial .overall-title {
        color: var(--amber);
      }
      .overall.good .overall-title {
        color: var(--green);
      }
      .products {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .products.single {
        grid-template-columns: 1fr;
      }
      .product {
        min-width: 0;
        padding: 9px 8px;
        background: #fff;
        border: 1px solid #b99dce;
        border-radius: 13px;
      }
      .product.alt {
        background: #fcfffd;
        border-color: #8bb69b;
      }
      .product small {
        display: block;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }
      .product.alt small {
        color: var(--green);
      }
      .product b {
        display: block;
        margin-top: 4px;
        overflow-wrap: anywhere;
        font-size: 11px;
        line-height: 1.22;
      }
      .matrix {
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .matrix-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 850;
      }
      .matrix-head span:last-child {
        color: var(--muted);
        font-size: 10px;
      }
      table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 4px;
        border-bottom: 1px solid var(--line);
        font-size: 9px;
        text-align: center;
        vertical-align: middle;
        overflow-wrap: anywhere;
      }
      th {
        color: var(--muted);
        font-weight: 850;
      }
      th:first-child,
      td:first-child {
        width: 32%;
        padding-left: 10px;
        text-align: left;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tr.metric-row {
        cursor: pointer;
      }
      tr.metric-row[aria-selected="true"] td:first-child {
        box-shadow: inset 4px 0 0 var(--plum);
      }
      .target {
        color: var(--plum-dark);
        background: var(--target);
      }
      .alternative {
        color: #1e603c;
        background: var(--green-bg);
      }
      .symbol {
        display: block;
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 900;
      }
      .result-icon {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        width: 19px;
        height: 19px;
        color: #fff;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 900;
      }
      .result-icon.bad {
        background: var(--red);
      }
      .result-icon.good {
        background: var(--green);
      }
      .result-icon.partial {
        background: var(--amber);
      }
      .status-word {
        font-size: 9px;
        font-weight: 850;
      }
      .status-word.bad {
        color: var(--red);
      }
      .status-word.good {
        color: var(--green);
      }
      .selected-panel {
        min-height: 112px;
        margin-top: 10px;
        padding: 12px 13px;
        background: #fff;
        border: 1px solid #cbb7dc;
        border-radius: 14px;
      }
      .selected-panel .eyebrow {
        color: var(--plum);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .selected-panel h2 {
        margin: 4px 0 5px;
        font-size: 15px;
      }
      .selected-panel p {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .selected-panel strong {
        color: var(--ink);
      }
      .basis {
        display: inline-flex;
        margin-top: 6px;
        padding: 3px 6px;
        color: var(--plum-dark);
        background: #f3eef9;
        border-radius: 5px;
        font-size: 9px;
        font-weight: 750;
      }
      .footer {
        flex: 0 0 auto;
        padding: 11px 18px 15px;
        background: #fffdfaea;
        border-top: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .cta {
        width: 100%;
        min-height: 53px;
        padding: 11px 15px;
        color: #fff;
        background: var(--coral);
        border: 0;
        border-radius: 27px;
        font-weight: 850;
      }

      /* 1: metric + pill */
      .v1-label {
        display: grid;
        gap: 4px;
      }
      .pill {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        width: max-content;
        max-width: 100%;
        padding: 3px 6px;
        border-radius: 10px;
        font-size: 8px;
        font-weight: 850;
      }
      .pill.bad {
        color: #752932;
        background: var(--red-bg);
      }
      .pill.good {
        color: #1e603c;
        background: var(--green-bg);
      }
      .v1 tr.row-bad td:nth-child(2) {
        color: #752932;
        background: var(--red-bg);
      }
      .v1 tr.row-good td:nth-child(2) {
        color: #1e603c;
        background: var(--green-bg);
      }
      .summary-line {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* 2: full-row soft tint */
      .v2 tr.row-bad td {
        background: #fff7f8;
      }
      .v2 tr.row-good td {
        background: #f5fbf7;
      }
      .v2 tr.row-bad td:first-child {
        border-left: 5px solid var(--red);
      }
      .v2 tr.row-good td:first-child {
        border-left: 5px solid var(--green);
      }
      .v2 .target {
        background: #f5f0f8 !important;
      }
      .v2 .alternative {
        background: #eef8f1 !important;
      }
      .metric-with-icon {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .metric-with-icon b {
        display: block;
      }
      .metric-with-icon small {
        display: block;
        margin-top: 2px;
      }

      /* 3: explicit result column */
      .v3 th:first-child,
      .v3 td:first-child {
        width: 25%;
      }
      .v3 th.result-col,
      .v3 td.result-col {
        width: 18%;
      }
      .v3 td.result-col.bad {
        color: #752932;
        background: var(--red-bg);
      }
      .v3 td.result-col.good {
        color: #1e603c;
        background: var(--green-bg);
      }
      .v3 .alternative-column {
        display: none;
      }

      /* 4: metric cards within a matrix */
      .metric-cards {
        display: grid;
        gap: 8px;
        padding: 10px;
      }
      .metric-card {
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        cursor: pointer;
      }
      .metric-card[aria-selected="true"] {
        border-color: #9d7aba;
        box-shadow: 0 0 0 2px #eee4f6;
      }
      .metric-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
      }
      .metric-card-head b {
        font-size: 11px;
      }
      .metric-values {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .metric-value {
        padding: 7px 4px;
        font-size: 9px;
        text-align: center;
      }
      .metric-value small {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
      }
      .metric-card.bad .metric-card-head {
        color: #752932;
        background: var(--red-bg);
      }
      .metric-card.good .metric-card-head {
        color: #1e603c;
        background: var(--green-bg);
      }

      /* 5: equation status */
      .equation {
        display: grid;
        gap: 3px;
      }
      .equation-status {
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 8px;
        font-weight: 850;
      }
      .v5 td.owned-bad {
        color: #752932;
        background: var(--red-bg);
      }
      .v5 td.owned-good {
        color: #1e603c;
        background: var(--green-bg);
      }
      .equal {
        color: var(--green);
        font-weight: 900;
      }
      .not-equal {
        color: var(--red);
        font-weight: 900;
      }
      .overall-meter {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        width: 118px;
        margin-top: 6px;
      }
      .overall-meter span {
        height: 5px;
        border-radius: 5px;
        background: #e5e0e5;
      }
      .overall-meter span.good {
        background: var(--green);
      }
      .overall-meter span.bad {
        background: var(--red);
      }
      .desktop table th,
      .desktop table td {
        padding: 11px 7px;
        font-size: 12px;
      }
      .desktop .products,
      .desktop .matrix,
      .desktop .selected-panel {
        max-width: 720px;
      }
      .desktop .footer {
        padding-inline: max(18px, calc((100% - 756px) / 2));
      }
      @media (max-width: 420px) {
        .canvas {
          padding-inline: 0;
        }
        .study-note {
          width: calc(100% - 20px);
        }
      }
    </style>
  </head>
  <body>
    <nav class="lab" aria-label="Prototyp-Steuerung">
      <strong>Zeilen-Ergebnis</strong>
      <div class="group" id="variantControls"></div>
      <div class="group" aria-label="Gesamturteil">
        <button type="button" data-case="bad" aria-pressed="true">Passt nicht</button>
        <button type="button" data-case="partial" aria-pressed="false">Passt teilweise</button>
        <button type="button" data-case="good" aria-pressed="false">Passt</button>
      </div>
      <div class="group">
        <button type="button" data-view="mobile" aria-pressed="true">Mobil</button
        ><button type="button" data-view="desktop" aria-pressed="false">Desktop</button>
      </div>
    </nav>
    <aside class="study-note" id="studyNote"></aside>
    <div class="canvas">
      <main class="journey" id="journey" aria-live="polite">
        <header>
          <div class="brand-row">
            <span class="brand">chaarlie</span><span class="saved">Gespeichert</span>
          </div>
          <div class="steps">
            <span class="step done">Bedarf</span><span class="step done">Verfeinerung</span
            ><span class="step active">Produkte</span><span class="step">Routine</span
            ><span class="step">Anwendung</span>
          </div>
        </header>
        <section class="content" id="content"></section>
        <footer class="footer">
          <button type="button" class="cta" id="cta">Diese Alternative wählen</button>
        </footer>
      </main>
    </div>
    <script>
      const definitions = [
        {
          id: "weight",
          name: "Pflegegewicht",
          target: "mittel",
          alt: "mittel",
          bad: "leicht",
          good: "mittel",
          why: "Mittlere Pflege gibt deinem Haar genug Geschmeidigkeit, ohne es unnötig zu beschweren.",
          basis: "braucht Pflege, wird aber schnell beschwert",
        },
        {
          id: "focus",
          name: "Pflegefokus",
          target: "ausgewogen",
          alt: "ausgewogen",
          bad: "Protein",
          good: "ausgewogen",
          why: "Ein ausgewogener Fokus verbindet Feuchtigkeit und Strukturpflege. Eine starke Proteinrichtung ist für deinen aktuellen Bedarf nicht nötig.",
          basis: "mehr Geschmeidigkeit, keine starke Strukturbelastung",
        },
        {
          id: "repair",
          name: "Repair-Unterstützung",
          target: "mittel",
          alt: "mittel",
          bad: "hoch",
          good: "mittel",
          why: "Mittlere Repair-Unterstützung reicht für deine derzeitige Belastung aus. Mehr Repair würde keinen zusätzlichen bestätigten Bedarf abdecken.",
          basis: "geringe bis mittlere aktuelle Belastung",
        },
      ]
      const variants = [
        {
          id: 1,
          label: "Status-Pill",
          title: "Status-Pill direkt unter dem Namen",
          note: "Das Worturteil sitzt bei der Metrik; nur der aktuelle Wert wird zusätzlich rot oder grün hinterlegt.",
        },
        {
          id: 2,
          label: "Status-Zeile",
          title: "Ganze Zeile als ruhiger Statusblock",
          note: "Linke Farbspur, Symbol und Worturteil bilden eine starke Zeilensignatur. Die weiche Flächentönung kann bei vielen Zeilen allerdings dominant werden.",
        },
        {
          id: 3,
          label: "Ergebnis-Spalte",
          title: "Eigene Ergebnis-Spalte",
          note: "„Passt / Passt nicht“ wird zu expliziten Tabellendaten. Sehr eindeutig, aber mobil muss dafür die Alternative aus der Matrix in die Produktkarte und ins Erklärpanel wandern.",
        },
        {
          id: 4,
          label: "Matrix-Karten",
          title: "Jede Metrik als kleine Matrix-Karte",
          note: "Das Urteil steht als Kartenüberschrift und die drei Werte bleiben darunter vergleichbar. Am stärksten segmentiert, aber etwas weniger tabellarisch.",
        },
        {
          id: 5,
          label: "Gleichung",
          title: "Deins = Ziel als visuelle Gleichung",
          note: "Die Zeile formuliert die Logik direkt: gleicher Wert bedeutet passt, ungleicher Wert bedeutet Abweichung. Kompakt, aber etwas technischer.",
        },
      ]
      const caseMap = {
        bad: {
          matches: [false, false, false],
          verdict: "Passt nicht",
          copy: "Keiner der drei geprüften Werte liegt aktuell im Ziel.",
          cta: "Diese Alternative wählen",
        },
        partial: {
          matches: [true, false, true],
          verdict: "Passt teilweise",
          copy: "Zwei Werte passen. Beim Pflegefokus gibt es eine relevante Abweichung.",
          cta: "Mein Produkt behalten",
        },
        good: {
          matches: [true, true, true],
          verdict: "Passt",
          copy: "Alle drei geprüften Werte liegen im Ziel. Ein Wechsel ist nicht nötig.",
          cta: "Mein Produkt behalten",
        },
      }
      let currentVariant = 1,
        currentCase = "bad",
        selected = "focus"
      const controls = document.getElementById("variantControls"),
        content = document.getElementById("content"),
        note = document.getElementById("studyNote"),
        journey = document.getElementById("journey"),
        cta = document.getElementById("cta")
      function rows() {
        const config = caseMap[currentCase]
        return definitions.map((d, i) => ({
          ...d,
          match: config.matches[i],
          own: config.matches[i] ? d.good : d.bad,
        }))
      }
      function statusIcon(match) {
        return `<span class="result-icon ${match ? "good" : "bad"}" aria-hidden="true">${match ? "✓" : "×"}</span>`
      }
      function statusText(match) {
        return match ? "Passt" : "Passt nicht"
      }
      function overallIcon() {
        if (currentCase === "good")
          return '<span class="result-icon good" aria-hidden="true">✓</span>'
        if (currentCase === "partial")
          return '<span class="result-icon partial" aria-hidden="true">◐</span>'
        return '<span class="result-icon bad" aria-hidden="true">×</span>'
      }
      function overall() {
        const c = caseMap[currentCase]
        const matched = c.matches.filter(Boolean).length
        const cls = currentCase === "bad" ? "bad" : currentCase === "good" ? "good" : "partial"
        if (currentVariant === 1)
          return `<div class="overall ${cls}"><div class="summary-line">${overallIcon()}<span class="overall-title">${c.verdict}</span></div><p class="overall-copy">${c.copy}</p></div>`
        if (currentVariant === 2)
          return `<div class="overall ${cls}"><span class="overall-title">${c.verdict}: ${matched} von 3 im Ziel</span><p class="overall-copy">${c.copy}</p></div>`
        if (currentVariant === 3)
          return `<div class="overall ${cls}"><span class="overall-title">${c.verdict}</span><p class="overall-copy">Das Ergebnis steht zusätzlich in jeder Matrixzeile.</p></div>`
        if (currentVariant === 4)
          return `<div class="overall ${cls}"><span class="overall-title">${c.verdict}</span><p class="overall-copy">${matched} passend · ${3 - matched} abweichend</p></div>`
        return `<div class="overall ${cls}"><span class="overall-title">${c.verdict}</span><div class="overall-meter">${c.matches.map((x) => `<span class="${x ? "good" : "bad"}"></span>`).join("")}</div><p class="overall-copy">Jeder Abschnitt steht für einen geprüften Wert.</p></div>`
      }
      function products() {
        const single = currentCase === "good"
        return `<div class="products ${single ? "single" : ""}"><article class="product"><small>Dein Produkt</small><b>Jean&amp;Len Conditioner Keratin/Mandel</b></article>${single ? "" : `<article class="product alt"><small>Passende Alternative</small><b>Sante Intense Hydration Conditioner</b></article>`}</div>`
      }
      function shell(body) {
        return `<div class="topline"><button class="back" type="button" aria-label="Zurück">←</button><span>Produkte prüfen</span></div><p class="context">Conditioner · 2 von 5</p><h1>Dein Conditioner im Vergleich</h1>${overall()}${products()}${body}${panel()}`
      }
      function table(head, body, cls = "") {
        return `<section class="matrix ${cls}"><div class="matrix-head"><span>Eigenschaft für Eigenschaft</span><span>Zeile antippen für Erklärung</span></div><table>${head}<tbody>${body}</tbody></table></section>`
      }
      function attrs(d) {
        return `class="metric-row row-${d.match ? "good" : "bad"}" tabindex="0" aria-selected="${selected === d.id}" data-select="${d.id}"`
      }
      function normalCells(d) {
        return `<td class="${d.match ? "owned-good" : "owned-bad"}">${d.own}</td><td class="target"><span class="symbol">▣</span>${d.target}</td><td class="alternative"><span class="symbol">✓</span>${d.alt}</td>`
      }
      function head() {
        return `<thead><tr><th>Prüfpunkt</th><th>Deins</th><th>Ziel</th><th>Alternative</th></tr></thead>`
      }
      function variant1() {
        const body = rows()
          .map(
            (d) =>
              `<tr ${attrs(d)}><td><div class="v1-label"><b>${d.name}</b><span class="pill ${d.match ? "good" : "bad"}">${d.match ? "✓" : "×"} ${statusText(d.match)}</span></div></td>${normalCells(d)}</tr>`,
          )
          .join("")
        return shell(table(head(), body, "v1"))
      }
      function variant2() {
        const body = rows()
          .map(
            (d) =>
              `<tr ${attrs(d)}><td><div class="metric-with-icon">${statusIcon(d.match)}<span><b>${d.name}</b><small class="status-word ${d.match ? "good" : "bad"}">${statusText(d.match)}</small></span></div></td>${normalCells(d)}</tr>`,
          )
          .join("")
        return shell(table(head(), body, "v2"))
      }
      function variant3() {
        const body = rows()
          .map(
            (d) =>
              `<tr ${attrs(d)}><td><b>${d.name}</b></td><td>${d.own}</td><td class="target">${d.target}</td><td class="result-col ${d.match ? "good" : "bad"}"><span class="symbol">${d.match ? "✓" : "×"}</span>${d.match ? "Passt" : "Passt nicht"}</td></tr>`,
          )
          .join("")
        const h = `<thead><tr><th>Prüfpunkt</th><th>Deins</th><th>Ziel</th><th class="result-col">Ergebnis</th></tr></thead>`
        return shell(table(h, body, "v3"))
      }
      function variant4() {
        const cards = rows()
          .map(
            (d) =>
              `<article class="metric-card ${d.match ? "good" : "bad"}" tabindex="0" aria-selected="${selected === d.id}" data-select="${d.id}"><div class="metric-card-head"><b>${d.name}</b><span>${d.match ? "✓ Passt" : "× Passt nicht"}</span></div><div class="metric-values"><div class="metric-value"><small>Deins</small><b>${d.own}</b></div><div class="metric-value target"><small>Ziel</small><b>${d.target}</b></div><div class="metric-value alternative"><small>Alternative</small><b>${d.alt}</b></div></div></article>`,
          )
          .join("")
        return shell(
          `<section class="matrix"><div class="matrix-head"><span>Eigenschaft für Eigenschaft</span><span>Karte antippen</span></div><div class="metric-cards">${cards}</div></section>`,
        )
      }
      function variant5() {
        const body = rows()
          .map(
            (d) =>
              `<tr ${attrs(d)}><td><div class="equation"><b>${d.name}</b><span class="equation-status ${d.match ? "equal" : "not-equal"}">${d.match ? "✓ Passt" : "× Passt nicht"}</span></div></td><td class="${d.match ? "owned-good" : "owned-bad"}">${d.own}</td><td class="target"><span class="symbol">${d.match ? "=" : "≠"}</span>${d.target}</td><td class="alternative">${d.alt} ✓</td></tr>`,
          )
          .join("")
        return shell(table(head(), body, "v5"))
      }
      function panel() {
        const d = rows().find((x) => x.id === selected) || rows()[0]
        return `<section class="selected-panel" aria-live="polite"><span class="eyebrow">Ausgewählter Prüfpunkt · ${statusText(d.match)}</span><h2>${d.name}</h2><p><strong>Warum ${d.target}?</strong> ${d.why}</p><span class="basis">Aus deinem Profil: ${d.basis}</span></section>`
      }
      function bind() {
        document.querySelectorAll("[data-select]").forEach((el) => {
          const choose = () => {
            selected = el.dataset.select
            render()
          }
          el.addEventListener("click", choose)
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault()
              choose()
            }
          })
        })
      }
      function render() {
        const v = variants.find((x) => x.id === currentVariant),
          renderers = { 1: variant1, 2: variant2, 3: variant3, 4: variant4, 5: variant5 }
        content.innerHTML = renderers[currentVariant]()
        cta.textContent = caseMap[currentCase].cta
        note.innerHTML = `<b>Variante ${v.id}: ${v.title}.</b> ${v.note} Auswahl-Panel und drei Gesamtzustände bleiben in allen Varianten identisch testbar.`
        document
          .querySelectorAll("[data-variant]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", String(Number(b.dataset.variant) === currentVariant)),
          )
        document
          .querySelectorAll("[data-case]")
          .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.case === currentCase)))
        content.scrollTop = 0
        bind()
      }
      variants.forEach((v) => {
        const b = document.createElement("button")
        b.type = "button"
        b.dataset.variant = String(v.id)
        b.textContent = `${v.id}. ${v.label}`
        b.setAttribute("aria-pressed", String(v.id === currentVariant))
        b.addEventListener("click", () => {
          currentVariant = v.id
          render()
        })
        controls.appendChild(b)
      })
      document.querySelectorAll("[data-case]").forEach((b) =>
        b.addEventListener("click", () => {
          currentCase = b.dataset.case
          selected = currentCase === "partial" ? "focus" : "weight"
          render()
        }),
      )
      document.querySelectorAll("[data-view]").forEach((b) =>
        b.addEventListener("click", () => {
          journey.classList.toggle("desktop", b.dataset.view === "desktop")
          document
            .querySelectorAll("[data-view]")
            .forEach((x) => x.setAttribute("aria-pressed", String(x === b)))
        }),
      )
      render()
    </script>
  </body>
</html>
