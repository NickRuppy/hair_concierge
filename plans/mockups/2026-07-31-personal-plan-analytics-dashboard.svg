<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
  <title id="title">Personal Plan analytics dashboard proposal</title>
  <desc id="desc">A PostHog dashboard wireframe with overall funnel, pricing experiment, current page diagnostics, checkout diagnosis, and tracking quality.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33177a"/>
      <stop offset="1" stop-color="#7257d8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#241b4d" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 30px; font-weight: 750; fill: #ffffff; }
      .subtitle { font-size: 15px; fill: #e9e2ff; }
      .panel-title { font-size: 18px; font-weight: 720; fill: #1f1938; }
      .panel-subtitle { font-size: 13px; fill: #655f78; }
      .small { font-size: 12px; fill: #777185; }
      .label { font-size: 12px; font-weight: 650; fill: #3d3652; }
      .value { font-size: 12px; font-weight: 750; fill: #35246f; }
    </style>
  </defs>
  <rect width="1440" height="1180" fill="#f6f4fb"/>
  <rect x="0" y="0" width="1440" height="154" fill="url(#header)"/>
  <g class="sans">
    <text class="title" x="64" y="58">Personal Plan — Funnel &amp; Seitendiagnostik</text>
    <text class="subtitle" x="64" y="88">Eine Journey · Akquisition separat · kommerzielle Varianten nur im Experiment · aktuelle Seitendiagnostik v3</text>
    <rect x="64" y="109" width="174" height="28" rx="14" fill="#ffffff" fill-opacity="0.16"/>
    <text x="80" y="128" font-size="12" font-weight="700" fill="#ffffff">Rollierende 7 Tage · UTC</text>

    <g filter="url(#shadow)">
      <rect x="48" y="184" width="1344" height="250" rx="18" fill="#ffffff"/>
    </g>
    <text class="panel-title" x="76" y="222">1 · Gesamtfunnel — Personal Plan</text>
    <text class="panel-subtitle" x="76" y="248">Alle Sessions der Personal-Plan-Journey, unabhängig von Seitenrevision oder Preisarm. Interne QA ausgeschlossen.</text>
    <line x1="92" y1="382" x2="1354" y2="382" stroke="#ddd7eb"/>
    <g>
      <rect x="104" y="292" width="128" height="90" rx="8" fill="#5b45d6"/>
      <rect x="282" y="306" width="128" height="76" rx="8" fill="#6652db"/>
      <rect x="460" y="332" width="128" height="50" rx="8" fill="#725fe0"/>
      <rect x="638" y="341" width="128" height="41" rx="8" fill="#806de5"/>
      <rect x="816" y="350" width="128" height="32" rx="8" fill="#8d7ce9"/>
      <rect x="994" y="357" width="128" height="25" rx="8" fill="#9b8aec"/>
      <rect x="1172" y="364" width="128" height="18" rx="8" fill="#a999ef"/>
      <text class="label" x="118" y="405">Offer</text>
      <text class="label" x="296" y="405">Pricing</text>
      <text class="label" x="474" y="405">Intent</text>
      <text class="label" x="652" y="405">Checkout</text>
      <text class="label" x="830" y="405">Anbieter</text>
      <text class="label" x="1008" y="405">Zahloption</text>
      <text class="label" x="1186" y="405">Kauf</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="462" width="1344" height="240" rx="18" fill="#ffffff"/>
    </g>
    <text class="panel-title" x="76" y="500">2 · Preisexperiment — Mitgliedschaft vs. einmalig</text>
    <text class="panel-subtitle" x="76" y="526">Nur tatsächlich zugewiesene Experimentarme. Leere Tabelle = noch keine Experiment-Sessions, nicht 0 % Conversion.</text>
    <rect x="76" y="552" width="1288" height="42" rx="8" fill="#f1edfb"/>
    <text class="label" x="96" y="578">Arm</text>
    <text class="label" x="330" y="578">Offer</text>
    <text class="label" x="445" y="578">Pricing</text>
    <text class="label" x="570" y="578">Intent</text>
    <text class="label" x="680" y="578">Checkout</text>
    <text class="label" x="805" y="578">Anbieter</text>
    <text class="label" x="930" y="578">Zahloption</text>
    <text class="label" x="1060" y="578">Käufe</text>
    <text class="label" x="1180" y="578">Conversion</text>
    <line x1="76" y1="635" x2="1364" y2="635" stroke="#e8e3f1"/>
    <text class="label" x="96" y="624">Mitgliedschaft</text>
    <text class="small" x="330" y="624">—</text><text class="small" x="445" y="624">—</text><text class="small" x="570" y="624">—</text>
    <text class="small" x="680" y="624">—</text><text class="small" x="805" y="624">—</text><text class="small" x="930" y="624">—</text>
    <text class="small" x="1060" y="624">—</text><text class="small" x="1180" y="624">—</text>
    <text class="label" x="96" y="670">Einmalig 29,99 €</text>
    <text class="small" x="330" y="670">—</text><text class="small" x="445" y="670">—</text><text class="small" x="570" y="670">—</text>
    <text class="small" x="680" y="670">—</text><text class="small" x="805" y="670">—</text><text class="small" x="930" y="670">—</text>
    <text class="small" x="1060" y="670">—</text><text class="small" x="1180" y="670">—</text>

    <g filter="url(#shadow)">
      <rect x="48" y="730" width="862" height="290" rx="18" fill="#ffffff"/>
      <rect x="938" y="730" width="454" height="290" rx="18" fill="#ffffff"/>
    </g>
    <text class="panel-title" x="76" y="768">3 · Aktuelle Seite v3 — Reichweite</text>
    <text class="panel-subtitle" x="76" y="794">Stabile Section-IDs in aktueller visueller Reihenfolge.</text>
    <g>
      <rect x="86" y="830" width="58" height="135" rx="5" fill="#5b45d6"/>
      <rect x="158" y="841" width="58" height="124" rx="5" fill="#6652db"/>
      <rect x="230" y="854" width="58" height="111" rx="5" fill="#725fe0"/>
      <rect x="302" y="866" width="58" height="99" rx="5" fill="#7f6ce4"/>
      <rect x="374" y="879" width="58" height="86" rx="5" fill="#8c79e8"/>
      <rect x="446" y="891" width="58" height="74" rx="5" fill="#9786eb"/>
      <rect x="518" y="903" width="58" height="62" rx="5" fill="#a293ee"/>
      <rect x="590" y="914" width="58" height="51" rx="5" fill="#ad9ff0"/>
      <rect x="662" y="924" width="58" height="41" rx="5" fill="#b8acf2"/>
      <rect x="734" y="934" width="58" height="31" rx="5" fill="#c3b9f4"/>
      <rect x="806" y="944" width="58" height="21" rx="5" fill="#cec6f6"/>
      <line x1="76" y1="965" x2="886" y2="965" stroke="#ddd7eb"/>
    </g>
    <text class="panel-title" x="966" y="768">Navigation ≠ Checkout-Intent</text>
    <text class="panel-subtitle" x="966" y="794">CTA-Semantik bleibt sichtbar getrennt.</text>
    <rect x="966" y="836" width="318" height="38" rx="7" fill="#d9d1f7"/>
    <rect x="966" y="894" width="168" height="38" rx="7" fill="#6c56da"/>
    <rect x="966" y="952" width="96" height="38" rx="7" fill="#9a89ec"/>
    <text class="label" x="980" y="860">Sticky → Pricing</text>
    <text x="980" y="918" font-size="12" font-weight="700" fill="#ffffff">Pricing → Checkout</text>
    <text x="980" y="976" font-size="12" font-weight="700" fill="#ffffff">Final → Checkout</text>

    <g filter="url(#shadow)">
      <rect x="48" y="1048" width="652" height="90" rx="18" fill="#ffffff"/>
      <rect x="724" y="1048" width="668" height="90" rx="18" fill="#ffffff"/>
    </g>
    <text class="panel-title" x="76" y="1083">Checkout-Diagnose</text>
    <text class="panel-subtitle" x="76" y="1108">Nur öffnen, wenn der Gesamtfunnel nach Intent abfällt.</text>
    <text class="panel-title" x="752" y="1083">Trackingqualität</text>
    <text class="panel-subtitle" x="752" y="1108">Aktuell · historisch · fehlend · unerwartete Identität.</text>
  </g>
</svg>
