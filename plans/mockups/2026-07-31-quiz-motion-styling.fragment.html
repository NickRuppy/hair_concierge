<div id="quiz-motion-demo">
  <div class="viz-controls qmd-controls">
    <label class="form-label" for="qmd-moment">
      Stil-Moment
      <select class="form-select" id="qmd-moment">
        <option value="question">Fragenwechsel</option>
        <option value="multi">Mehrfachauswahl</option>
        <option value="bridge">Abschnittsbrücke</option>
        <option value="profile">Profil entsteht</option>
        <option value="plan">Planwahl</option>
      </select>
    </label>
    <label class="form-check form-switch" for="qmd-reduce">
      <input class="form-check-input" id="qmd-reduce" type="checkbox">
      <span class="form-check-label">Bewegung reduzieren</span>
    </label>
    <button class="btn" id="qmd-replay" type="button">
      <i data-lucide="rotate-ccw" aria-hidden="true"></i>
      Neu abspielen
    </button>
  </div>

  <p class="text-small text-muted qmd-note" id="qmd-note" aria-live="polite"></p>

  <div class="qmd-stage">
    <section class="card qmd-phone" aria-label="Interaktive Vorschau des mobilen Quiz-Stylings">
      <header class="qmd-header">
        <button class="btn btn-ghost qmd-back" type="button" aria-label="Zurück">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <span class="qmd-brand">chaarlie</span>
        <span class="qmd-chapter" id="qmd-chapter">Analyse</span>
      </header>
      <div class="qmd-progress" aria-label="Fortschritt">
        <span class="qmd-progress-track"><span class="qmd-progress-fill" id="qmd-progress-fill"></span></span>
        <span class="qmd-progress-labels" aria-hidden="true">
          <span>Profil</span><span>Ziele</span><span>Analyse</span><span>Plan</span><span>Ergebnis</span>
        </span>
      </div>
      <main class="qmd-screen" id="qmd-screen"></main>
      <footer class="qmd-footer" id="qmd-footer"></footer>
    </section>
  </div>
</div>

<style>

  }

  }

  #quiz-motion-demo .qmd-option[aria-pressed="true"] {
    border-color: var(--qmd-plum);
    background: color-mix(in srgb, var(--card) 82%, var(--qmd-plum) 18%);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--qmd-plum) 28%, transparent);
    color: var(--card-foreground);
  }

  #quiz-motion-demo .qmd-option-icon {
    display: grid;

  }

  #quiz-motion-demo .qmd-option-copy {
    display: grid;

  }

  #quiz-motion-demo .qmd-option-copy strong {

  }

  #quiz-motion-demo .qmd-option-copy small {

  #quiz-motion-demo .qmd-check {

    place-items: center;

    border: 1px solid var(--qmd-line);
    border-radius: 50%;

    transition:
      transform 180ms cubic-bezier(.2, 1.4, .4, 1),
      background-color 140ms ease-out,

  }

  #quiz-motion-demo .qmd-option[aria-pressed="true"] .qmd-check {
    border-color: var(--qmd-plum);

    transform: scale(1);
  }

  #quiz-motion-demo .qmd-footer {
    min-height: 74px;

  #quiz-motion-demo .qmd-primary {

  #quiz-motion-demo .qmd-primary:active {

  #quiz-motion-demo .qmd-enter {

      radial-gradient(circle at 26% 34%, color-mix(in srgb, var(--qmd-coral) 28%, transparent) 0 16%, transparent 17%),
      radial-gradient(circle at 68% 30%, color-mix(in srgb, var(--qmd-plum) 25%, transparent) 0 20%, transparent 21%),
      linear-gradient(145deg, var(--qmd-soft), color-mix(in srgb, var(--card) 76%, var(--qmd-coral) 24%));
  }

  #quiz-motion-demo .qmd-bridge-ring {
    display: grid;
    width: 96px;
    height: 96px;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--qmd-plum) 55%, transparent);
    border-radius: 50%;
    background: color-mix(in srgb, var(--card) 88%, transparent);
    color: var(--qmd-plum);
    animation: qmd-bridge-ring 480ms cubic-bezier(.2, 1.2, .4, 1) both;
  }

  #quiz-motion-demo .qmd-profile {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
  }

  #quiz-motion-demo .qmd-profile-item {
    display: grid;
    gap: 4px;
    min-height: 84px;
    align-content: center;
    padding: 12px;
    border-bottom: 2px solid var(--qmd-line);

    animation: qmd-profile-in 260ms cubic-bezier(.22, .8, .2, 1) forwards;
  }

  #quiz-motion-demo .qmd-profile-item small {
    color: var(--muted-foreground);
  }

  #quiz-motion-demo .qmd-profile-item strong {
    color: var(--qmd-plum);

  }

  #quiz-motion-demo .qmd-profile-item:nth-child(2) { animation-delay: 70ms; }
  #quiz-motion-demo .qmd-profile-item:nth-child(3) { animation-delay: 140ms; }
  #quiz-motion-demo .qmd-profile-item:nth-child(4) { animation-delay: 210ms; }

  #quiz-motion-demo .qmd-plan-options {
    display: grid;
    gap: 9px;
    margin-top: 16px;
  }

  #quiz-motion-demo .qmd-plan {
    display: grid;

    align-items: center;

    border-color: var(--qmd-line);

    transition:
      transform 100ms ease-out,
      background-color 180ms ease-out,
      border-color 180ms ease-out;
  }

  #quiz-motion-demo .qmd-plan:active {
    transform: scale(.985);
  }

  #quiz-motion-demo .qmd-plan[aria-pressed="true"] {
    border-color: var(--qmd-plum);

  #quiz-motion-demo .qmd-radio {

  #quiz-motion-demo .qmd-plan[aria-pressed="true"] .qmd-radio::after {
    width: 10px;

  }

  #quiz-motion-demo .qmd-plan-name {
    display: grid;
  }

  #quiz-motion-demo .qmd-plan-name strong {
    font-weight: 500;
  }

  #quiz-motion-demo .qmd-plan-name small {
    color: var(--muted-foreground);
  }

  #quiz-motion-demo .qmd-price {
    font-weight: 500;
    white-space: nowrap;
  }

  #quiz-motion-demo.qmd-reduced *,
  #quiz-motion-demo.qmd-reduced *::before,
  #quiz-motion-demo.qmd-reduced *::after {

    animation-delay: 0ms !important;
    transition-duration: 1ms !important;
  }

  @keyframes qmd-screen-in {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes qmd-screen-out {
    from { opacity: 1; transform: translateX(0); }

  @media (prefers-reduced-motion: reduce) {

    #quiz-motion-demo *::before,
    #quiz-motion-demo *::after {

  @media (max-width: 420px) {

    }

    }

    #quiz-motion-demo .qmd-title {
      font-size: 1.72rem;
    }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("quiz-motion-demo");
    const momentSelect = root.querySelector("#qmd-moment");
    const reduceToggle = root.querySelector("#qmd-reduce");
    const replayButton = root.querySelector("#qmd-replay");
    const screen = root.querySelector("#qmd-screen");
    const footer = root.querySelector("#qmd-footer");
    const note = root.querySelector("#qmd-note");
    const chapter = root.querySelector("#qmd-chapter");
    const progress = root.querySelector("#qmd-progress-fill");

    const notes = {
      question: "200 ms · Auswahl bestätigt, dann wechselt nur der Inhalt — Header und Fortschritt bleiben ruhig.",
      multi: "Sofortige Auswahl · Der CTA zählt mit und reagiert einmal kurz, ohne dauerhaft zu pulsieren.",
      bridge: "Einmaliger 480-ms-Payoff · Abschnittswechsel fühlt sich bewusst an, ohne künstliche Wartezeit.",
      profile: "Vier Felder in 70-ms-Abständen · Personalisierung wird sichtbar zusammengesetzt und stoppt danach.",
      plan: "180 ms · Auswahlring, Preis und CTA aktualisieren sich ohne Layoutsprung."
    };

    const icons = {
      smooth: "sparkles",
      uneven: "waves",
      rough: "wind",
      moisture: "droplets",
      frizz: "cloud",
      definition: "align-center",
      shine: "sun"
    };

    function icon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`;
    }

    function option(label, detail, key, multi = false) {
      return `
        <button class="btn qmd-option" type="button" aria-pressed="false" data-option="${key}" data-multi="${multi}">
          <span class="qmd-option-icon">${icon(icons[key] || "circle")}</span>
          <span class="qmd-option-copy"><strong>${label}</strong>${detail ? `<small>${detail}</small>` : ""}</span>
          <span class="qmd-check">${icon("check")}</span>
        </button>
      `;
    }

    function primary(label, disabled = false) {
      return `<button class="btn btn-primary btn-block qmd-primary" type="button" ${disabled ? "disabled" : ""}>${label} ${icon("arrow-right")}</button>`;
    }

    function activateIcons() {
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    function setFrame(name, progressWidth, chapterName) {
      note.textContent = notes[name];
      progress.style.width = progressWidth;
      chapter.textContent = chapterName;
      screen.classList.remove("qmd-exit", "qmd-enter");
      void screen.offsetWidth;
      screen.classList.add("qmd-enter");
    }

    function renderQuestion(second = false) {
      setFrame("question", second ? "58%" : "52%", "Analyse");
      screen.innerHTML = second
        ? `
          <p class="qmd-eyebrow">Deine Analyse</p>
          <h2 class="qmd-title">Wie reagiert dein Haar beim Dehnen?</h2>
          <p class="qmd-copy">Teste nur sanft an einem einzelnen ausgefallenen Haar.</p>
          <div class="qmd-options">
            ${option("Es dehnt sich etwas und geht zurück", "", "smooth")}
            ${option("Es bleibt gedehnt", "", "uneven")}
            ${option("Es reißt schnell", "", "rough")}
          </div>
        `
        : `
          <p class="qmd-eyebrow">Deine Analyse</p>
          <h2 class="qmd-title">Wie fühlt sich deine Haaroberfläche an?</h2>
          <p class="qmd-copy">Streiche vorsichtig an einer einzelnen trockenen Strähne entlang.</p>
          <div class="qmd-options">
            ${option("Glatt", "Die Strähne gleitet gleichmäßig.", "smooth")}
            ${option("Leicht uneben", "Du spürst kleine Unebenheiten.", "uneven")}
            ${option("Rau", "Die Strähne fühlt sich trocken oder rau an.", "rough")}
          </div>
        `;
      footer.innerHTML = "";
      screen.querySelectorAll("[data-option]").forEach((button) => {
        button.addEventListener("click", () => {
          screen.querySelectorAll("[data-option]").forEach((peer) => peer.setAttribute("aria-pressed", "false"));
          button.setAttribute("aria-pressed", "true");
          if (!second) {
            window.setTimeout(() => {
              screen.classList.remove("qmd-enter");
              screen.classList.add("qmd-exit");
              window.setTimeout(() => renderQuestion(true), root.classList.contains("qmd-reduced") ? 1 : 160);
            }, root.classList.contains("qmd-reduced") ? 1 : 300);
          }
        });
      });
      activateIcons();
    }

    function renderMulti() {
      setFrame("multi", "38%", "Ziele");
      screen.innerHTML = `
        <h2 class="qmd-title">Was wünschst du dir für deine Wellen?</h2>
        <p class="qmd-copy">Wähle alles aus, was dir wichtig ist.</p>
        <div class="qmd-options">
          ${option("Feuchtigkeit ohne Beschweren", "", "moisture", true)}
          ${option("Weniger Frizz", "", "frizz", true)}
          ${option("Mehr Wellen-Definition", "", "definition", true)}
          ${option("Mehr Glanz", "", "shine", true)}
        </div>
      `;
      footer.innerHTML = primary("Weiter", true);
      const cta = footer.querySelector("button");
      screen.querySelectorAll("[data-option]").forEach((button) => {
        button.addEventListener("click", () => {
          button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") === "true" ? "false" : "true");
          const count = screen.querySelectorAll('[data-option][aria-pressed="true"]').length;
          cta.disabled = count === 0;
          cta.innerHTML = count === 0 ? `Weiter ${icon("arrow-right")}` : `${count} ausgewählt · Weiter ${icon("arrow-right")}`;
          cta.classList.remove("qmd-bump");
          void cta.offsetWidth;
          cta.classList.add("qmd-bump");
          activateIcons();
        });
      });
      activateIcons();
    }

    function renderBridge() {
      setFrame("bridge", "42%", "Ziele");
      screen.innerHTML = `
        <p class="qmd-eyebrow">Dein Profil wird genauer</p>
        <h2 class="qmd-title">Deine Antworten werden zu einem echten Haarprofil.</h2>
        <div class="qmd-bridge-visual" role="img" aria-label="Symbolische Verbindung deiner Antworten">
          <span class="qmd-bridge-ring">${icon("sparkles")}</span>
        </div>
        <p class="qmd-copy">Als Nächstes verbinden wir deine Ziele mit einfachen Beobachtungen deiner Haare.</p>
      `;
      footer.innerHTML = primary("Haaranalyse fortsetzen");
      activateIcons();
    }

    function renderProfile() {
      setFrame("profile", "64%", "Analyse");
      screen.innerHTML = `
        <p class="qmd-eyebrow">Deine Analyse</p>
        <h2 class="qmd-title">Dein Profil nimmt Form an.</h2>
        <p class="qmd-copy">Wir verbinden deine Angaben Schritt für Schritt zu einem klareren Bild.</p>
        <div class="qmd-profile" aria-label="Persönliches Haarprofil">
          <div class="qmd-profile-item"><small>Struktur</small><strong>Wellig</strong></div>
          <div class="qmd-profile-item"><small>Dicke</small><strong>Mittel</strong></div>
          <div class="qmd-profile-item"><small>Dichte</small><strong>Mittlere Dichte</strong></div>
          <div class="qmd-profile-item"><small>Schwerpunkt</small><strong>Feuchtigkeit & Frizz</strong></div>
        </div>
      `;
      footer.innerHTML = primary("Weiter");
      activateIcons();
    }

    const plans = {
      month: { label: "Monatlich", detail: "Flexibel kündbar", price: "14,99 €", cta: "Monat · 14,99 € → Zahlung" },
      quarter: { label: "Quartal", detail: "Beliebteste Wahl", price: "34,99 €", cta: "Quartal · 34,99 € → Zahlung" },
      year: { label: "Jährlich", detail: "Bester Monatswert", price: "99,99 €", cta: "Jahr · 99,99 € → Zahlung" }
    };

    function planOption(key, selected) {
      const plan = plans[key];
      return `
        <button class="btn qmd-plan" type="button" aria-pressed="${selected}" data-plan="${key}">
          <span class="qmd-radio" aria-hidden="true"></span>
          <span class="qmd-plan-name"><strong>${plan.label}</strong><small>${plan.detail}</small></span>
          <span class="qmd-price">${plan.price}</span>
        </button>
      `;
    }

    function updatePlan(key) {
      screen.querySelectorAll("[data-plan]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.plan === key ? "true" : "false");
      });
      const cta = footer.querySelector("button");
      cta.innerHTML = `${plans[key].cta} ${icon("arrow-right")}`;
      cta.classList.remove("qmd-bump");
      void cta.offsetWidth;
      cta.classList.add("qmd-bump");
      activateIcons();
    }

    function renderPlan() {
      setFrame("plan", "86%", "Ergebnis");
      screen.innerHTML = `
        <p class="qmd-eyebrow">Plan freischalten</p>
        <h2 class="qmd-title">Wähle den Zugang, der zu dir passt.</h2>
        <p class="qmd-copy">Der Inhalt bleibt gleich. Du entscheidest nur über die Laufzeit.</p>
        <div class="qmd-plan-options">
          ${planOption("month", false)}
          ${planOption("quarter", true)}
          ${planOption("year", false)}
        </div>
      `;
      footer.innerHTML = primary(plans.quarter.cta);
      screen.querySelectorAll("[data-plan]").forEach((button) => {
        button.addEventListener("click", () => updatePlan(button.dataset.plan));
      });
      activateIcons();
    }

    function renderCurrent() {
      const value = momentSelect.value;
      if (value === "question") renderQuestion(false);
      if (value === "multi") renderMulti();
      if (value === "bridge") renderBridge();
      if (value === "profile") renderProfile();
      if (value === "plan") renderPlan();
    }

    momentSelect.addEventListener("change", renderCurrent);
    replayButton.addEventListener("click", renderCurrent);
    reduceToggle.addEventListener("change", () => {
      root.classList.toggle("qmd-reduced", reduceToggle.checked);
      renderCurrent();
    });

    renderCurrent();
  })();
</script>
