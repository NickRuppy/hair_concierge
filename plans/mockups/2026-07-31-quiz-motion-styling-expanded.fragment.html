<div id="quiz-motion-expanded">
  <div class="viz-controls qme-controls">
    <label class="form-label" for="qme-moment">
      Ergänzung
      <select class="form-select" id="qme-moment">
        <option value="navigation">Vorwärts & zurück</option>
        <option value="milestone">Abschnittsmeilenstein</option>
        <option value="offer">Kontext-CTA im Angebot</option>
        <option value="secondary">FAQ & Checkout-Ausgang</option>
      </select>
    </label>
    <label class="form-check form-switch" for="qme-reduce">
      <input class="form-check-input" id="qme-reduce" type="checkbox">
      <span class="form-check-label">Bewegung reduzieren</span>
    </label>
    <button class="btn" id="qme-replay" type="button">
      <i data-lucide="rotate-ccw" aria-hidden="true"></i>
      Neu abspielen
    </button>
  </div>

  <p class="text-small text-muted qme-note" id="qme-note" aria-live="polite"></p>

  <div class="qme-stage">
    <section class="card qme-phone" aria-label="Interaktive Vorschau zusätzlicher mobiler Styling-Momente">
      <header class="qme-header">
        <button class="btn btn-ghost qme-back" id="qme-back" type="button" aria-label="Zurück">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
        </button>
        <span class="qme-brand">chaarlie</span>
        <span class="qme-chapter" id="qme-chapter">Analyse</span>
      </header>
      <div class="qme-progress" aria-label="Fortschritt">
        <span class="qme-progress-line">
          <span class="qme-progress-fill" id="qme-progress-fill"></span>
          <span class="qme-milestone" id="qme-milestone" aria-hidden="true"></span>
        </span>
        <span class="qme-progress-labels" aria-hidden="true">
          <span>Profil</span><span>Ziele</span><span>Analyse</span><span>Plan</span><span>Ergebnis</span>
        </span>
      </div>
      <main class="qme-screen" id="qme-screen"></main>
      <footer class="qme-footer" id="qme-footer"></footer>
      <div class="qme-overlay" id="qme-overlay" hidden></div>
    </section>
  </div>
</div>

<script>
  (() => {
    const root = document.getElementById("quiz-motion-expanded");
    const momentSelect = root.querySelector("#qme-moment");
    const reduceToggle = root.querySelector("#qme-reduce");
    const replayButton = root.querySelector("#qme-replay");
    const backButton = root.querySelector("#qme-back");
    const screen = root.querySelector("#qme-screen");
    const footer = root.querySelector("#qme-footer");
    const note = root.querySelector("#qme-note");
    const chapter = root.querySelector("#qme-chapter");
    const progress = root.querySelector("#qme-progress-fill");
    const milestone = root.querySelector("#qme-milestone");
    const overlay = root.querySelector("#qme-overlay");

    let navigationStep = 0;
    let offerReached = false;

    const notes = {
      navigation: "Vorwärts bewegt sich der Inhalt nach links; Zurück kehrt die Richtung um. Der feste Rahmen bleibt ruhig.",
      milestone: "Der Abschnittsmarker füllt, vergrößert sich einmal und setzt sich wieder — kein dauerhaftes Pulsieren.",
      offer: "Beim Erreichen der Preise wechselt der Sticky-CTA vom Wegweiser zum gewählten Plan inklusive Preis.",
      secondary: "FAQ-Höhe und Pfeil bewegen sich ruhig. Checkout warnt nur, wenn tatsächlich Eingaben vorhanden sind."
    };

    function icon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`;
    }

    function activateIcons() {
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    function setBase(name, width, markerLeft, chapterName) {
      note.textContent = notes[name];
      progress.style.width = width;
      milestone.style.left = markerLeft;
      chapter.textContent = chapterName;
      screen.className = "qme-screen";
      overlay.hidden = true;
    }

    function option(label, detail, key, iconName) {
      return `
        <button class="btn qme-option" type="button" aria-pressed="false" data-option="${key}">
          <span class="qme-option-icon">${icon(iconName)}</span>
          <span class="qme-option-copy"><strong>${label}</strong><small>${detail}</small></span>
          <span class="qme-check">${icon("check")}</span>
        </button>
      `;
    }

    function primary(label, id = "") {
      return `<button class="btn btn-primary btn-block qme-primary" ${id ? `id="${id}"` : ""} type="button">${label} ${icon("arrow-right")}</button>`;
    }

    function animateScreen(direction, renderNext) {
      screen.className = `qme-screen qme-exit-${direction}`;
      window.setTimeout(() => {
        renderNext();
        screen.className = `qme-screen qme-enter-${direction}`;
      }, root.classList.contains("qme-reduced") ? 1 : 160);
    }

    function bindSingleSelect(onSelected) {
      screen.querySelectorAll("[data-option]").forEach((button) => {
        button.addEventListener("click", () => {
          screen.querySelectorAll("[data-option]").forEach((peer) => peer.setAttribute("aria-pressed", "false"));
          button.setAttribute("aria-pressed", "true");
          window.setTimeout(onSelected, root.classList.contains("qme-reduced") ? 1 : 280);
        });
      });
    }

    function renderNavigationStep(step, direction = "forward") {
      navigationStep = step;
      setBase("navigation", step === 0 ? "52%" : "58%", step === 0 ? "52%" : "58%", "Analyse");
      backButton.disabled = step === 0;
      screen.innerHTML = step === 0
        ? `
          <p class="qme-eyebrow">Deine Analyse</p>
          <h2 class="qme-title">Wie fühlt sich deine Haaroberfläche an?</h2>
          <p class="qme-copy">Streiche vorsichtig an einer einzelnen trockenen Strähne entlang.</p>
          <div class="qme-options">
            ${option("Glatt", "Die Strähne gleitet gleichmäßig.", "smooth", "sparkles")}
            ${option("Leicht uneben", "Du spürst kleine Unebenheiten.", "uneven", "waves")}
            ${option("Rau", "Die Strähne fühlt sich trocken oder rau an.", "rough", "wind")}
          </div>
        `
        : `
          <p class="qme-eyebrow">Deine Analyse</p>
          <h2 class="qme-title">Wie reagiert dein Haar beim Dehnen?</h2>
          <p class="qme-copy">Teste nur sanft an einem einzelnen ausgefallenen Haar.</p>
          <div class="qme-options">
            ${option("Es dehnt sich etwas und geht zurück", "Elastisch und belastbar.", "elastic", "move-horizontal")}
            ${option("Es bleibt gedehnt", "Braucht mehr Stabilität.", "stretched", "minus")}
            ${option("Es reißt schnell", "Reagiert empfindlich.", "breaks", "scissors")}
          </div>
        `;
      footer.innerHTML = "";
      bindSingleSelect(() => {
        if (step === 0) animateScreen("forward", () => renderNavigationStep(1, "forward"));
      });
      activateIcons();
    }

    function renderMilestone(completed = false) {
      setBase("milestone", completed ? "60%" : "40%", completed ? "60%" : "40%", completed ? "Analyse" : "Ziele");
      backButton.disabled = false;
      screen.innerHTML = completed
        ? `
          <p class="qme-eyebrow">Ziele abgeschlossen</p>
          <h2 class="qme-title">Jetzt machen wir dein Profil genauer.</h2>
          <div class="qme-milestone-visual" role="img" aria-label="Abgeschlossener Quiz-Abschnitt">
            <span class="qme-milestone-ring">${icon("sparkles")}</span>
          </div>
          <p class="qme-copy">Die nächsten Beobachtungen verbinden deine Ziele mit deinem Haarprofil.</p>
        `
        : `
          <p class="qme-eyebrow">Letzte Frage in Ziele</p>
          <h2 class="qme-title">Was beschäftigt dich gerade?</h2>
          <p class="qme-copy">Deine Auswahl ist vollständig. Der nächste Abschnitt beginnt gleich.</p>
          <div class="qme-options">
            ${option("Trockene oder raue Längen", "Wiederkehrender Schwerpunkt.", "dry", "droplets")}
            ${option("Weniger Frizz", "Mehr Ruhe in den Längen.", "frizz", "cloud")}
          </div>
        `;
      footer.innerHTML = primary(completed ? "Haaranalyse fortsetzen" : "2 ausgewählt · Weiter", "qme-milestone-next");
      footer.querySelector("#qme-milestone-next").addEventListener("click", () => {
        if (completed) return;
        milestone.classList.remove("is-settling");
        void milestone.offsetWidth;
        milestone.classList.add("is-settling");
        animateScreen("forward", () => renderMilestone(true));
      });
      activateIcons();
    }

    const plans = {
      month: { label: "Monatlich", detail: "Flexibel kündbar", price: "14,99 €", cta: "Monat · 14,99 € → Zahlung" },
      quarter: { label: "Quartal", detail: "Beliebteste Wahl", price: "34,99 €", cta: "Quartal · 34,99 € → Zahlung" },
      year: { label: "Jährlich", detail: "Bester Monatswert", price: "99,99 €", cta: "Jahr · 99,99 € → Zahlung" }
    };

    function planOption(key, selected) {
      const plan = plans[key];
      return `
        <button class="btn qme-plan" type="button" aria-pressed="${selected}" data-plan="${key}">
          <span class="qme-radio" aria-hidden="true"></span>
          <span class="qme-plan-name"><strong>${plan.label}</strong><small>${plan.detail}</small></span>
          <span class="qme-price">${plan.price}</span>
        </button>
      `;
    }

    function updateOfferPlan(key) {
      screen.querySelectorAll("[data-plan]").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.plan === key ? "true" : "false");
      });
      const cta = footer.querySelector("button");
      cta.innerHTML = `${plans[key].cta} ${icon("arrow-right")}`;
      cta.classList.remove("qme-bump");
      void cta.offsetWidth;
      cta.classList.add("qme-bump");
      activateIcons();
    }

    function renderOffer(reached = false) {
      offerReached = reached;
      setBase("offer", "86%", "86%", "Ergebnis");
      backButton.disabled = true;
      screen.innerHTML = reached
        ? `
          <p class="qme-eyebrow">Plan freischalten</p>
          <h2 class="qme-title">Wähle den Zugang, der zu dir passt.</h2>
          <p class="qme-copy">Der Inhalt bleibt gleich. Du entscheidest nur über die Laufzeit.</p>
          <div class="qme-plans">
            ${planOption("month", false)}
            ${planOption("quarter", true)}
            ${planOption("year", false)}
          </div>
        `
        : `
          <p class="qme-eyebrow">Deine persönliche Auswertung</p>
          <h2 class="qme-title">Deine Wellen brauchen Balance statt mehr Produkte.</h2>
          <div class="qme-mini-result">
            <span class="qme-result-line"><small>Struktur</small><strong>Wellig</strong></span>
            <span class="qme-result-line"><small>Schwerpunkt</small><strong>Feuchtigkeit</strong></span>
            <span class="qme-result-line"><small>Alltag</small><strong>Einfach</strong></span>
            <span class="qme-result-line"><small>Ziel</small><strong>Weniger Frizz</strong></span>
          </div>
          <p class="qme-copy">Der Sticky-CTA bleibt zunächst ein Wegweiser. Erst bei der Preiswahl wird er zur Kaufaktion.</p>
        `;
      footer.innerHTML = primary(reached ? plans.quarter.cta : "Pläne ansehen", "qme-offer-cta");
      if (reached) {
        screen.querySelectorAll("[data-plan]").forEach((button) => {
          button.addEventListener("click", () => updateOfferPlan(button.dataset.plan));
        });
      } else {
        footer.querySelector("#qme-offer-cta").addEventListener("click", () => {
          animateScreen("forward", () => renderOffer(true));
        });
      }
      activateIcons();
    }

    function faqItem(question, answer, id) {
      return `
        <div>
          <button class="btn btn-ghost qme-faq-button" type="button" aria-expanded="false" aria-controls="${id}" data-faq>
            <span>${question}</span>${icon("chevron-down")}
          </button>
          <div class="qme-faq-answer" id="${id}"><div><p>${answer}</p></div></div>
        </div>
      `;
    }

    function closeOverlay() {
      overlay.hidden = true;
      overlay.innerHTML = "";
    }

    function showCheckout() {
      overlay.hidden = false;
      overlay.innerHTML = `
        <section class="qme-sheet" role="dialog" aria-modal="true" aria-labelledby="qme-sheet-title">
          <div class="qme-sheet-head">
            <h3 id="qme-sheet-title">Sicher bezahlen</h3>
            <button class="btn btn-ghost qme-sheet-close" type="button" aria-label="Zahlung schließen">${icon("x")}</button>
          </div>
          <p class="text-small text-muted">Quartal · 34,99 € · anschließend 34,99 € alle 3 Monate</p>
          <label class="form-label" for="qme-card">
            Kartennummer
            <input class="form-control" id="qme-card" inputmode="numeric" placeholder="1234 1234 1234 1234">
          </label>
          ${primary("Zahlungspflichtig abonnieren")}
        </section>
      `;
      const close = overlay.querySelector(".qme-sheet-close");
      const field = overlay.querySelector("#qme-card");
      close.addEventListener("click", () => {
        if (!field.value.trim()) {
          closeOverlay();
          return;
        }
        const sheet = overlay.querySelector(".qme-sheet");
        sheet.innerHTML = `
          <div class="qme-confirm">
            <h3>Zahlung abbrechen?</h3>
            <p>Deine Eingabe wird verworfen.</p>
            <div class="qme-confirm-actions">
              <button class="btn" type="button" data-stay>Weiter bezahlen</button>
              <button class="btn btn-primary" type="button" data-abort>Zahlung abbrechen</button>
            </div>
          </div>
        `;
        sheet.querySelector("[data-stay]").addEventListener("click", showCheckout);
        sheet.querySelector("[data-abort]").addEventListener("click", closeOverlay);
      });
      activateIcons();
    }

    function renderSecondary() {
      setBase("secondary", "86%", "86%", "Ergebnis");
      backButton.disabled = true;
      screen.innerHTML = `
        <p class="qme-eyebrow">Noch Fragen?</p>
        <h2 class="qme-title">Klarheit ohne visuelles Theater.</h2>
        <p class="qme-copy">Öffne eine Frage oder teste den Checkout-Ausgang.</p>
        <div class="qme-faq">
          ${faqItem("Was ist in meinem Plan enthalten?", "Produkte, Reihenfolge, Anwendung und Häufigkeit — passend zu deinem Profil.", "qme-faq-a")}
          ${faqItem("Kann ich später kündigen?", "Ja. Die Laufzeit und der nächste Preis bleiben jederzeit sichtbar.", "qme-faq-b")}
        </div>
      `;
      footer.innerHTML = primary("Zahlung öffnen", "qme-open-payment");
      screen.querySelectorAll("[data-faq]").forEach((button) => {
        button.addEventListener("click", () => {
          const answer = root.querySelector(`#${button.getAttribute("aria-controls")}`);
          const open = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", open ? "false" : "true");
          answer.classList.toggle("is-open", !open);
        });
      });
      footer.querySelector("#qme-open-payment").addEventListener("click", showCheckout);
      activateIcons();
    }

    function renderCurrent() {
      overlay.hidden = true;
      overlay.innerHTML = "";
      if (momentSelect.value === "navigation") renderNavigationStep(0);
      if (momentSelect.value === "milestone") renderMilestone(false);
      if (momentSelect.value === "offer") renderOffer(false);
      if (momentSelect.value === "secondary") renderSecondary();
    }

    backButton.addEventListener("click", () => {
      if (momentSelect.value === "navigation" && navigationStep === 1) {
        animateScreen("back", () => renderNavigationStep(0, "back"));
      }
      if (momentSelect.value === "offer" && offerReached) {
        animateScreen("back", () => renderOffer(false));
      }
    });

    momentSelect.addEventListener("change", renderCurrent);
    replayButton.addEventListener("click", renderCurrent);
    reduceToggle.addEventListener("change", () => {
      root.classList.toggle("qme-reduced", reduceToggle.checked);
      renderCurrent();
    });

    renderCurrent();
  })();
</script>
